# app/ フォルダだけを GitHub Pages に配信する。
# data/ や docs/ や tools/ は配信しない（リポジトリ上では見えるが、URLでは開けない）。
#
# 使う前に一度だけ、GitHubの Settings → Pages → Source を
# 「GitHub Actions」に切り替えること。
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:        # 手動でも動かせるようにしておく

permissions:
  contents: read
  pages: write
  id-token: write

# 同時に走らないようにする。走行中のものは終わらせてから新しいものを流す
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # データが壊れていたら公開しない
      - name: データを検証する
        run: node tools/validate.mjs

      # 手元でのビルド忘れを防ぐため、ここで作り直してから配信する
      - name: アプリを作る
        run: node tools/build-app.mjs

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: app

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
