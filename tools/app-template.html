<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>首都圏てつどうずかん</title>
<meta name="description" content="首都圏の鉄道と全国の新幹線を、漢字とふりがなで調べられる図鑑。">
<!-- ホーム画面に置いてアプリのように使うための設定 -->
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#ffc93c">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="てつどうずかん">
<style>
  :root{
    --bg:#eef1f7; --card:#ffffff; --ink:#1b1f2a; --muted:#6b7280;
    --line:#dfe3ec; --accent:#2f6df6; --radius:16px;
    --shadow:0 1px 2px rgba(20,25,40,.06), 0 6px 18px rgba(20,25,40,.06);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic UI","Meiryo",system-ui,sans-serif;
    line-height:1.5; -webkit-text-size-adjust:100%;
    /* 指で押したときの青いちらつきを消し、自前の反応色だけを見せる */
    -webkit-tap-highlight-color:transparent;
  }
  .wrap{max-width:760px;margin:0 auto;padding:0 14px 64px}

  /* ---- ヘッダー ---- */
  header{
    position:sticky; top:0; z-index:20; background:rgba(238,241,247,.94);
    backdrop-filter:blur(8px); border-bottom:1px solid var(--line);
  }
  .hd{max-width:760px;margin:0 auto;padding:10px 14px 12px}
  .hd-top{display:flex;align-items:center;gap:8px;min-height:40px}
  .brand{font-size:19px;font-weight:800;letter-spacing:.02em;min-width:0}
  .brand small{display:block;font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.08em}
  /* 路線・駅を見ているときは、いま何を見ているかを題名に出す。
     ボタンが2つ並ぶので、題名は小さくして1行に収める */
  .hd-top.nav .brand{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .hd-top.nav .brand small{display:none}
  .navbtn{
    appearance:none;border:1px solid var(--line);background:var(--card);color:var(--ink);
    font:inherit;font-size:14px;font-weight:700;padding:9px 13px;border-radius:999px;cursor:pointer;
    display:none;align-items:center;gap:4px;white-space:nowrap;flex:none;min-height:40px;
  }
  .navbtn:hover{background:#f3f5fa}
  .navbtn:active{background:#e2e8f8}
  .navbtn.on{display:inline-flex}

  /* ---- 事業者タブ（横スクロール） ---- */
  .tabs{
    display:none;gap:8px;overflow-x:auto;overflow-y:hidden;
    max-width:760px;margin:0 auto;padding:0 14px 10px;
    -webkit-overflow-scrolling:touch;scrollbar-width:none;
  }
  .tabs::-webkit-scrollbar{display:none}
  .tabs.on{display:flex}
  .tab{
    flex:none;appearance:none;border:1px solid var(--line);background:var(--card);color:var(--ink);
    font:inherit;font-size:14px;font-weight:700;padding:8px 15px;border-radius:999px;
    cursor:pointer;white-space:nowrap;min-height:44px;   /* 指で押しやすい大きさ */
  }
  .tab:active{background:#e2e8f8}
  .tab.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .search{position:relative;margin-top:10px}
  .search input{
    width:100%;font:inherit;font-size:16px;padding:12px 40px 12px 40px;
    border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--ink);
    box-shadow:var(--shadow);
  }
  .search input:focus{outline:2px solid var(--accent);outline-offset:1px}
  .search .ico{position:absolute;left:14px;top:50%;transform:translateY(-50%);opacity:.45}
  .search .clr{
    position:absolute;right:8px;top:50%;transform:translateY(-50%);
    border:0;background:#e6e9f2;color:#555;border-radius:50%;width:26px;height:26px;
    font:inherit;font-size:15px;line-height:1;cursor:pointer;display:none;
  }
  .search .clr.on{display:block}

  /* ---- 共通パーツ ---- */
  /* 事業者の見出し。分類でしぼると1画面に収まらないことがあるので、
     スクロール中もどの事業者を見ているか分かるよう上部に貼りつける。
     .opsec で1事業者ずつ囲ってあるので、見出しが積み重なることはない */
  .opsec{margin-top:14px}
  h2.sec{
    position:sticky; top:calc(var(--hh, 177px) - 1px); z-index:5;
    font-size:13px;font-weight:800;color:var(--muted);letter-spacing:.12em;
    margin:0;padding:8px 0;background:var(--bg);
  }
  .card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
  .row{
    display:flex;align-items:center;gap:12px;width:100%;text-align:left;
    padding:14px;border:0;border-top:1px solid var(--line);background:none;
    font:inherit;color:inherit;cursor:pointer;min-height:66px;
  }
  .row:first-child{border-top:0}
  .row:hover{background:#f5f7fc}
  .row:active{background:#e2e8f8}
  .row .chev{margin-left:auto;color:#c3c8d4;font-size:20px;flex:none}

  /* 駅名: ひらがなを上、漢字を下に置く */
  .nm{min-width:0}
  .nm .kana{font-size:12px;color:var(--muted);letter-spacing:.04em;line-height:1.25}
  .nm .kanji{font-size:19.5px;font-weight:700;letter-spacing:.01em;line-height:1.3}
  .nm .sub{font-size:12px;color:var(--muted);font-weight:600}
  .nm.sm .kanji{font-size:17px}

  /* 路線記号バッジ（自前描画・公式ロゴは使わない） */
  .badge{
    flex:none;width:44px;height:44px;border-radius:50%;background:#fff;
    border:3.5px solid var(--c);display:flex;flex-direction:column;
    align-items:center;justify-content:center;color:var(--c);line-height:1;
  }
  .badge .s{font-size:11px;font-weight:800;letter-spacing:.02em}
  .badge .n{font-size:15px;font-weight:800;margin-top:1px;font-variant-numeric:tabular-nums}
  .badge.only .s{font-size:19px}
  .badge.sm{width:36px;height:36px;border-width:3px}
  .badge.sm .s{font-size:9px} .badge.sm .n{font-size:12.5px}
  .badge.sm.only .s{font-size:16px}
  /* 駅ナンバリングが無い路線は、記号のかわりに路線カラーの丸を出す */
  .badge.dot{background:var(--c);border-color:#fff;box-shadow:0 0 0 3.5px var(--c)}
  .badge.dot.sm{box-shadow:0 0 0 3px var(--c)}
  .mini.dot{background:var(--c2);border-color:#fff;box-shadow:0 0 0 2.5px var(--c2)}

  .pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700;color:#fff;background:var(--c)}

  /* ---- 路線ヘッダー ---- */
  .lhead{display:flex;align-items:center;gap:14px;padding:16px;background:var(--card);
         border-radius:var(--radius);box-shadow:var(--shadow);border-left:8px solid var(--c)}
  .lhead .t{min-width:0}
  .lhead .t .kana{font-size:12px;color:var(--muted)}
  .lhead .t .nm2{font-size:23px;font-weight:800;line-height:1.25}
  .lhead .t .meta{font-size:12px;color:var(--muted);margin-top:3px}
  .swatch{width:13px;height:13px;border-radius:4px;background:var(--c);display:inline-block;
          vertical-align:-2px;margin-right:5px}

  /* ---- 駅リスト（縦のレール） ---- */
  .rail{position:relative;background:var(--card);border-radius:var(--radius);
        box-shadow:var(--shadow);padding:6px 0;margin-top:12px}
  .stop{display:flex;align-items:center;gap:13px;width:100%;text-align:left;
        padding:11px 14px;border:0;background:none;font:inherit;color:inherit;cursor:pointer;position:relative;
        min-height:64px}
  .stop:hover{background:#f5f7fc}
  .stop:active{background:#e2e8f8}
  /* 駅詳細から路線にもどってきたとき、その駅を一瞬光らせて居場所を知らせる */
  @keyframes findme{
    0%,60%{background:#fff3bf}
    100%{background:transparent}
  }
  .stop.focus{animation:findme 2.4s ease-out}
  .stop.focus .nm .kanji{color:#8a6d00}
  .track{position:relative;flex:none;width:44px;display:flex;justify-content:center}
  /* 駅と駅をつなぐ線 */
  .stop::before{content:"";position:absolute;left:calc(14px + 22px - 3px);top:0;bottom:0;
                width:6px;background:var(--c)}
  .stop:first-child::before{top:50%}
  .stop:last-child::before{bottom:50%}
  .stop .track > *{position:relative;z-index:1}
  .xfer{margin-left:auto;display:flex;flex-wrap:wrap;gap:4px;justify-content:flex-end;max-width:44%}
  .xfer .mini{width:22px;height:22px;border-radius:50%;border:2.5px solid var(--c2);background:#fff;
              color:var(--c2);font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center}

  /* ---- 駅詳細 ---- */
  .shead{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 16px}
  .shead .kana{font-size:14px;color:var(--muted);letter-spacing:.06em}
  .shead .kanji{font-size:31px;font-weight:800;line-height:1.2}
  .shead .sub{font-size:14px;color:var(--muted);font-weight:700;margin-top:2px}
  .shead .cnt{font-size:13px;color:var(--muted);margin-top:8px}
  .lncard{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);
          margin-top:11px;padding:13px 14px;border-left:8px solid var(--c)}
  .lncard .hd2{display:flex;align-items:center;gap:11px}
  .lncard .hd2 .t{font-size:17px;font-weight:800}
  .lncard .hd2 .t small{display:block;font-size:11px;font-weight:600;color:var(--muted)}
  .lncard .go{margin-left:auto;border:1px solid var(--line);background:#fff;color:var(--ink);
              font:inherit;font-size:12px;font-weight:700;padding:6px 11px;border-radius:999px;cursor:pointer}
  .lncard .go:hover{background:#f3f5fa}
  .nbrs{display:flex;gap:8px;margin-top:11px;font-size:12.5px}
  .nbr{flex:1;min-width:0;background:#f5f7fc;border-radius:11px;padding:10px;
       border:0;font:inherit;text-align:left;cursor:pointer;color:inherit;min-height:52px}
  .nbr:hover{background:#eaeefa}
  .nbr:active{background:#dde4f7}
  .nbr .lbl{font-size:10.5px;color:var(--muted);font-weight:700;letter-spacing:.06em}
  .nbr .v{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .nbr.end{color:var(--muted);cursor:default;background:#f7f8fb}
  .nbr.end:hover{background:#f7f8fb}

  /* 歩いて乗り換える駅。同じ駅の乗換と見分けられるよう点線の丸にする */
  .xfer .mini.walk{border-style:dashed}
  .xfer .mini.dot.walk{box-shadow:none;border:2.5px dashed var(--c2)}
  .walksec{margin-top:18px}
  .walksec .wkind{font-size:11.5px;color:#2f6df6;font-weight:700;margin-top:2px}

  /* 列車の停車駅。いつも停まる駅は塗りつぶし、ときどきの駅は白抜きにする */
  .tdot{flex:none;width:22px;height:22px;border-radius:50%;background:var(--c);
        border:3px solid var(--c);position:relative;z-index:1}
  .stop.sometimes .tdot{background:#fff}
  .stop.sometimes .nm .kanji{color:var(--muted)}
  .stop .wkind{margin-left:auto;font-size:11.5px;color:var(--muted);font-weight:700}

  /* 「ろせんを見る」は指で押しやすい大きさに */
  .lncard .go{padding:9px 14px;font-size:13px;min-height:40px}
  /* 新幹線の丸に入る「新」の字 */
  .badge.dot{color:#fff;font-weight:800;font-size:17px}
  .badge.dot.sm{font-size:14px}
  .xfer .mini.dot{color:#fff;font-size:11px}
  /* 環状線 */
  .loopmark{color:var(--c)}
  .stop.loopend{min-height:54px}
  .loopicon{width:32px;height:32px;border-radius:50%;background:#fff;border:3px solid var(--c);
            color:var(--c);display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:800}
  .looptxt{font-size:14px;font-weight:700;color:var(--muted)}
  /* 横に並ぶボタン（とまる新幹線・すきな路線と駅） */
  .chipcard{padding:12px}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{appearance:none;font:inherit;font-size:15px;font-weight:800;padding:8px 14px;min-height:44px;
        border-radius:999px;border:2.5px solid var(--c,#2f6df6);background:#fff;color:var(--ink);cursor:pointer}
  .chip:active{background:#e2e8f8}
  .chip.some{border-style:dashed;color:var(--muted)}
  .chip.sta{--c:#aab2c3}
  .chiplegend{font-size:11.5px;color:var(--muted);margin-top:10px}
  /* すき（お気に入り） */
  .favbtn{appearance:none;flex:none;font:inherit;font-size:13px;font-weight:800;padding:8px 13px;min-height:40px;
          border-radius:999px;border:1.5px solid #e6c34a;background:#fff;color:#8a6d00;cursor:pointer}
  .favbtn.on{background:#ffe27a;border-color:#e0b000}
  .favbtn:active{background:#fff3bf}
  .lhead .favbtn{margin-left:auto;align-self:flex-start}
  .shead .favbtn{margin-top:10px}
  /* タブがまだ右にあることを、右はしを薄くして知らせる */
  .tabs{-webkit-mask-image:linear-gradient(to right,#000 calc(100% - 40px),transparent);
        mask-image:linear-gradient(to right,#000 calc(100% - 40px),transparent)}
  .tabs.end{-webkit-mask-image:none;mask-image:none}

  .empty{text-align:center;color:var(--muted);padding:40px 16px;font-size:14px}
  .note{font-size:11.5px;color:var(--muted);margin-top:26px;line-height:1.7;text-align:center}
  .warn{background:#fff8e6;border:1px solid #f2dfa8;color:#7a5c00;border-radius:12px;
        padding:9px 12px;font-size:12px;margin-top:12px}
  @media (max-width:430px){
    /* スマホでは英字の副題を出さない。子どもには読めず、画面が狭くなるだけなので */
    .brand small{display:none}
    .brand{font-size:18px}
    .xfer{max-width:38%}
  }
  @media (max-height:500px){
    /* スマホを横に倒したとき。ヘッダーを詰めて一覧を見る場所を確保する */
    .brand small{display:none}
    .brand{font-size:17px}
    .hd{padding:6px 14px 7px}
    .search{margin-top:7px}
    .search input{padding:9px 40px}
    .tabs{padding-bottom:7px}
    .tab{min-height:38px;padding:6px 14px}
  }
  /* iPhoneのノッチ（切り欠き）やホームバーに文字が隠れないようにする */
  .hd, .tabs{padding-left:max(14px, env(safe-area-inset-left));padding-right:max(14px, env(safe-area-inset-right))}
  .wrap{padding-left:max(14px, env(safe-area-inset-left));padding-right:max(14px, env(safe-area-inset-right));
        padding-bottom:calc(64px + env(safe-area-inset-bottom))}
</style>
</head>
<body>
<header>
  <div class="hd">
    <div class="hd-top" id="hdtop">
      <button class="navbtn" id="back" type="button">‹ もどる</button>
      <button class="navbtn" id="top" type="button">トップ</button>
      <div class="brand" id="brand">首都圏てつどうずかん<small>SHUTOKEN TETSUDO ZUKAN</small></div>
    </div>
    <div class="search">
      <span class="ico">🔍</span>
      <input id="q" type="search" inputmode="search" autocomplete="off"
             placeholder="えきや ろせんを さがす">
      <button class="clr" id="clr" type="button" aria-label="消す">×</button>
    </div>
  </div>
  <div class="tabs" id="tabs"></div>
</header>

<div class="wrap" id="view"></div>

<script id="data" type="application/json">__RAILWAY_DATA__</script>
<script>
(function(){
"use strict";
var DATA = JSON.parse(document.getElementById("data").textContent);
var LINES = DATA.lines, STATIONS = {}, OPS = {};
DATA.stations.forEach(function(s){ STATIONS[s.id] = s; });
DATA.operators.forEach(function(o){ OPS[o.id] = o; });

// 駅 -> その駅を通る路線
var BY_STATION = {};
LINES.forEach(function(L){
  L.stations.forEach(function(e, i){
    (BY_STATION[e.stationId] || (BY_STATION[e.stationId] = [])).push({line:L, idx:i, numbering:e.numbering});
  });
});

// 駅 → 歩いて乗り換えられる別名の駅（data/transfers.json 由来）
var WALKS = {};
(DATA.walks || []).forEach(function(w){
  var a = w.stations[0], b = w.stations[1];
  (WALKS[a] || (WALKS[a] = [])).push({to:b, kind:w.kind});
  (WALKS[b] || (WALKS[b] = [])).push({to:a, kind:w.kind});
});
var WALK_LABEL = {
  "same-facility": "すぐ となり",
  "passage": "ちかの みちで つながっている",
  "official": "のりかえ できる えき",
  "near": "あるいて すぐ"
};

// 新幹線の列車（のぞみ・はやぶさ など）
var TRAINS = DATA.trains || [];
var TRAINS_OF_LINE = {}, TRAINS_OF_STATION = {};
TRAINS.forEach(function(t){
  (t.lines || []).forEach(function(lid){ (TRAINS_OF_LINE[lid] || (TRAINS_OF_LINE[lid] = [])).push(t); });
  (t.stops || []).forEach(function(s){
    (TRAINS_OF_STATION[s.stationId] || (TRAINS_OF_STATION[s.stationId] = [])).push({train:t, stop:s.stop});
  });
});

// ---- ちいさな道具 ----
function el(tag, cls, txt){
  var n = document.createElement(tag);
  if (cls) n.className = cls;
  if (txt != null) n.textContent = txt;
  return n;
}
function kataToHira(s){
  return s.replace(/[ァ-ヶ]/g, function(c){
    return String.fromCharCode(c.charCodeAt(0) - 0x60);
  });
}
// 同じ字の書き分け。駅名は事業者の表記（螢田・西ヶ原四丁目など）に合わせてあるが、
// 検索では「蛍田」「西ケ原」と打っても見つかるように、どちらも同じ字にそろえて比べる
var FOLD = { "ヶ": "ケ", "ヵ": "カ", "螢": "蛍", "屛": "屏", "麴": "麹" };
function norm(s){
  var t = String(s || "");
  // 半角カタカナ・全角英数を先に寄せてから、カタカナをひらがなに直す
  try { t = t.normalize("NFKC"); } catch (e) {}
  t = t.replace(/[ヶヵ螢屛麴]/g, function(c){ return FOLD[c]; });
  return kataToHira(t.toLowerCase()).replace(/[\s　\-‐－・]/g, "");
}
function fullName(st){ return st.name + (st.subName ? "〈" + st.subName + "〉" : ""); }
function fullKana(st){ return st.kana + (st.subKana ? "〈" + st.subKana + "〉" : ""); }

// 駅名ブロック（ひらがなを上、漢字を下）
function nameBlock(st, small){
  var b = el("div", "nm" + (small ? " sm" : ""));
  b.appendChild(el("div", "kana", st.kana));
  var k = el("div", "kanji", st.name);
  b.appendChild(k);
  if (st.subName){
    b.appendChild(el("div", "sub", "〈" + st.subName + "〉 " + st.subKana));
  }
  return b;
}
// 記号を持たない路線の丸に入れる字。新幹線は色だけの丸が4つ5つ並ぶと
// どれが新幹線か分からないので「新」を入れる。それ以外は色だけのまま
function dotLabel(line){ return line.category === "shinkansen" ? "新" : ""; }
// 路線記号バッジ
// 駅ナンバリングが無い路線（総武本線など）は記号を持たないので、路線カラーの丸を出す
function badge(line, numbering, small){
  var m = /^([A-Za-z]+)(\d+)$/.exec(numbering || "");
  if (!m && !line.symbol){
    var d = el("div", "badge dot" + (small ? " sm" : ""), dotLabel(line) || null);
    d.style.setProperty("--c", line.color);
    d.title = line.name;
    return d;
  }
  var b = el("div", "badge" + (small ? " sm" : "") + (m ? "" : " only"));
  b.style.setProperty("--c", line.color);
  b.appendChild(el("div", "s", m ? m[1] : line.symbol));
  if (m) b.appendChild(el("div", "n", m[2]));
  return b;
}
// 乗りかえ表示用の小さい丸。記号が無い路線は色だけの丸にする
function mini(line, walk){
  var m = el("div", "mini" + (line.symbol ? "" : " dot") + (walk ? " walk" : ""), line.symbol || dotLabel(line));
  m.style.setProperty("--c2", line.color);
  m.title = line.name;
  return m;
}
// 路線上で step だけ進んだ駅。環状線（山手線・大阪環状線）は端から反対の端へつながる
function neighbor(L, idx, step){
  var j = idx + step, n = L.stations.length;
  if (L.loop) j = (j + n) % n;
  return L.stations[j];
}
// 「JY02 神田」のような表示。駅番号が無ければ駅名だけ
function stopLabel(entry, st){ return (entry.numbering ? entry.numbering + " " : "") + st.name; }
function chev(){ return el("div", "chev", "›"); }

// ---- 画面 ----
var view  = document.getElementById("view");
var back  = document.getElementById("back");
var topBtn= document.getElementById("top");
var hdtop = document.getElementById("hdtop");
var brand = document.getElementById("brand");
var tabs  = document.getElementById("tabs");
var qbox  = document.getElementById("q");
var clr   = document.getElementById("clr");
var stack = [];

// スマホの「戻る」（Androidの戻るボタン／iOSのスワイプ）でも1画面ずつもどれるように、
// 画面を進むたびに履歴を1つ積む。file:// で開くと使えない環境もあるので必ず try で囲む
function pushHistory(){
  try { history.pushState({ d: stack.length }, ""); } catch (e) {}
}
function resetHistory(){
  try { history.replaceState({ d: 1 }, ""); } catch (e) {}
}
window.addEventListener("popstate", function(e){
  var d = (e.state && e.state.d) || 1;
  while (stack.length > d) stack.pop();
  var s = stack[stack.length - 1];
  render(s); updateNav(s); window.scrollTo(0, s.y || 0);
});

// 画面を離れるときスクロール位置を覚えておき、もどったら同じ場所を出す
function go(state, push){
  var isPush = (push !== false);
  if (isPush){
    if (stack.length) stack[stack.length - 1].y = window.scrollY;
    stack.push(state);
    pushHistory();
  }
  render(state);
  updateNav(state);
  // 駅からその路線を開いたときは、その駅まで送って光らせる
  var spot = (isPush && state.v === "line" && state.focus)
    ? view.querySelector(".stop.focus") : null;
  if (spot){
    var head = document.querySelector("header").getBoundingClientRect().height;
    window.scrollTo(0, Math.max(0, window.scrollY + spot.getBoundingClientRect().top - head - 12));
  } else {
    window.scrollTo(0, state.y || 0);
  }
}
back.onclick = function(){
  if (stack.length <= 1) return;
  // 履歴が使えるなら history.back() に任せる（popstate 側で画面をもどす）。
  // 使えない環境では自前でもどす
  var before = stack.length;
  try { history.back(); } catch (e) {}
  setTimeout(function(){
    if (stack.length === before){ stack.pop(); go(stack[stack.length - 1], false); }
  }, 60);
};
topBtn.onclick = function(){
  qbox.value = ""; clr.classList.remove("on");
  var op = null;                       // 選んでいた事業者タブは保ったままにする
  for (var i = stack.length - 1; i >= 0; i--){ if (stack[i].v === "home"){ op = stack[i].op; break; } }
  stack = [{ v:"home", op:op }];
  resetHistory();
  go(stack[0], false);
};

// 見出しとボタンの出しわけ。いま何を見ているかを題名に出す
function updateNav(s){
  var isHome = (s.v === "home");
  back.classList.toggle("on", stack.length > 1);
  topBtn.classList.toggle("on", !isHome);
  hdtop.classList.toggle("nav", !isHome);
  tabs.classList.toggle("on", isHome);
  if (isHome){
    brand.innerHTML = "首都圏てつどうずかん<small>SHUTOKEN TETSUDO ZUKAN</small>";
  } else if (s.v === "line"){
    var L = lineById(s.id);
    brand.textContent = L ? L.name : "ろせん";
  } else if (s.v === "station"){
    var st = STATIONS[s.id];
    brand.textContent = st ? st.name + " えき" : "えき";
  } else if (s.v === "train"){
    var tr = null;
    for (var i = 0; i < TRAINS.length; i++) if (TRAINS[i].id === s.id) tr = TRAINS[i];
    brand.textContent = tr ? tr.name : "れっしゃ";
  } else {
    brand.textContent = "けんさく";
  }
  syncHeaderHeight();   // タブの出し入れで高さが変わるので貼りつけ位置を取り直す
}

function lineById(id){
  for (var i = 0; i < LINES.length; i++) if (LINES[i].id === id) return LINES[i];
  return null;
}

function render(s){
  view.innerHTML = "";
  if (s.v === "home")    return viewHome(s.op);
  if (s.v === "line")    return viewLine(s.id, s.focus);
  if (s.v === "station") return viewStation(s.id);
  if (s.v === "train")   return viewTrain(s.id);
  if (s.v === "search")  return viewSearch(s.q);
}

// ---- 大分類タブ ----
// JR／地下鉄／私鉄／モノレール・新交通／その他 の5つ。事業者ではなく種類でまとめる
function buildTabs(){
  var list = [{ id:null, label:"ぜんぶ" }].concat(DATA.categories);
  list.forEach(function(t){
    var b = el("button", "tab", t.label); b.type = "button";
    b.dataset.cat = t.id == null ? "" : t.id;
    b.onclick = function(){ selectCat(t.id); };
    tabs.appendChild(b);
  });
}
function selectCat(catId){
  var s = stack[stack.length - 1];
  if (s.v !== "home"){ go({ v:"home", op:catId }); return; }
  s.op = catId; s.y = 0;               // タブの切りかえで履歴は増やさない
  render(s); markTabs(catId);
  window.scrollTo(0, 0);
}
function tabsEnd(){
  tabs.classList.toggle("end", tabs.scrollLeft + tabs.clientWidth >= tabs.scrollWidth - 4);
}
tabs.addEventListener("scroll", tabsEnd);
window.addEventListener("resize", tabsEnd);
function markTabs(catId){
  var want = catId == null ? "" : catId;
  Array.prototype.forEach.call(tabs.children, function(b){
    var on = (b.dataset.cat === want);
    b.classList.toggle("on", on);
    if (on && b.scrollIntoView) b.scrollIntoView({ block:"nearest", inline:"center" });
  });
  tabsEnd();
}
// 見出しを画面上部に貼りつけるため、ヘッダーの高さを CSS に伝える
function syncHeaderHeight(){
  var h = document.querySelector("header").getBoundingClientRect().height;
  document.documentElement.style.setProperty("--hh", Math.round(h) + "px");
}
window.addEventListener("resize", syncHeaderHeight);
window.addEventListener("orientationchange", function(){ setTimeout(syncHeaderHeight, 200); });

// ---- すき（お気に入り）----
// よく見る路線・駅をすぐ開けるように覚えておく。この端末のブラウザの中だけに保存し、外には送らない
var FAV_KEY = "tetsudo-zukan:fav";
function loadFav(){
  try {
    var v = JSON.parse(localStorage.getItem(FAV_KEY) || "{}");
    return { lines: v.lines || [], stations: v.stations || [] };
  } catch (e) { return { lines: [], stations: [] }; }
}
function saveFav(f){ try { localStorage.setItem(FAV_KEY, JSON.stringify(f)); } catch (e) {} }
function toggleFav(kind, id){
  var f = loadFav(), a = f[kind], i = a.indexOf(id);
  if (i >= 0) a.splice(i, 1); else a.unshift(id);      // 新しく足したものを先頭に
  saveFav(f);
  return i < 0;
}
function favButton(kind, id){
  var b = el("button", "favbtn"); b.type = "button";
  function paint(on){
    b.textContent = on ? "★ すき" : "☆ すき";
    b.classList.toggle("on", on);
    b.setAttribute("aria-pressed", on ? "true" : "false");
  }
  paint(loadFav()[kind].indexOf(id) >= 0);
  b.onclick = function(ev){ ev.stopPropagation(); paint(toggleFav(kind, id)); };
  return b;
}
function favSection(){
  var f = loadFav();
  var ls = f.lines.map(lineById).filter(Boolean);
  var ss = f.stations.map(function(id){ return STATIONS[id]; }).filter(Boolean);
  if (!ls.length && !ss.length) return null;
  var sec = el("section", "opsec");
  sec.appendChild(el("h2", "sec", "★ すきな ろせん・えき"));
  var c = el("div", "card chipcard");
  var chips = el("div", "chips");
  ls.forEach(function(L){
    var b = el("button", "chip", L.name); b.type = "button";
    b.style.setProperty("--c", L.color);
    b.onclick = function(){ go({v:"line", id:L.id}); };
    chips.appendChild(b);
  });
  ss.forEach(function(st){
    var b = el("button", "chip sta", st.name); b.type = "button";
    b.onclick = function(){ go({v:"station", id:st.id}); };
    chips.appendChild(b);
  });
  c.appendChild(chips);
  sec.appendChild(c);
  return sec;
}

// 路線いちらんの1行
function lineRow(L, sub){
  var r = el("button", "row"); r.type = "button";
  r.appendChild(badge(L, null));
  var nm = el("div", "nm");
  nm.appendChild(el("div", "kana", L.kana));

}

// ① 路線いちらん（catId を渡すとその分類だけにしぼる）
function viewHome(catId){
  markTabs(catId);
  if (!catId){ var fs = favSection(); if (fs) view.appendChild(fs); }
  var shown = 0, shownSt = 0;
  if (catId === "shinkansen"){
    // 新幹線はJR5社にまたがるので、会社ごとに分けず北から南の順に1つに並べる
    var sk = LINES.filter(function(L){ return L.category === "shinkansen"; });
    var ssec = el("section", "opsec");
    ssec.appendChild(el("h2", "sec", "きた から みなみ へ"));
    var sc = el("div", "card");
    sk.forEach(function(L){
      shown++; shownSt += L.stations.length;
      sc.appendChild(lineRow(L, OPS[L.operatorId].shortName + " ・ " + L.stations.length + "えき"));
    });
    ssec.appendChild(sc);
    view.appendChild(ssec);
  } else {
    DATA.operators.forEach(function(o){
      var ls = LINES.filter(function(L){
        return L.operatorId === o.id && (!catId || L.category === catId);
      });
      if (!ls.length) return;
      shown += ls.length;
      ls.forEach(function(L){ shownSt += L.stations.length; });
      // 事業者ごとに囲っておく。こうしないと貼りついた見出しが次々と積み重なってしまう
      var sec = el("section", "opsec");
      sec.appendChild(el("h2", "sec", o.shortName));
      var c = el("div", "card");
      ls.forEach(function(L){ c.appendChild(lineRow(L)); });
      sec.appendChild(c);
      view.appendChild(sec);
    });
  }
  var n = el("div", "note");
  var cat = catId && DATA.categories.filter(function(c){ return c.id === catId; })[0];
  n.innerHTML = cat
    ? cat.label + "：" + shown + "ろせん / " + shownSt + "えき"
    : DATA.lines.length + "ろせん / " + DATA.stations.length + "えき<br>"
      + "てつどうがいしゃの こうしきの ものでは ありません";
  view.appendChild(n);
}

// ② 路線 → 駅（起点から順）。focus に駅idを渡すとその駅を目立たせる
function viewLine(id, focus){
  var L = lineById(id);
  if (!L) return;
  var h = el("div", "lhead"); h.style.setProperty("--c", L.color);
  h.appendChild(badge(L, null));
  var t = el("div", "t");
  t.appendChild(el("div", "kana", L.kana));
  t.appendChild(el("div", "nm2", L.name));
  var meta = el("div", "meta");
  meta.innerHTML = '<span class="swatch"></span>' + L.colorName + " ・ "
    + OPS[L.operatorId].shortName + " ・ " + L.stations.length + "えき"
    + (L.loop ? ' ・ <b class="loopmark">↻ ぐるっと 1しゅう</b>' : "");
  t.appendChild(meta);
  h.appendChild(t);
  h.appendChild(favButton("lines", L.id));
  view.appendChild(h);

  var rail = el("div", "rail");
  L.stations.forEach(function(e, i){
    var st = STATIONS[e.stationId];
    var b = el("button", "stop" + (focus && st.id === focus ? " focus" : "")); b.type = "button";
    b.style.setProperty("--c", L.color);
    var tr = el("div", "track");
    tr.appendChild(badge(L, e.numbering, true));
    b.appendChild(tr);
    b.appendChild(nameBlock(st));
    // 乗りかえできる路線
    var others = (BY_STATION[st.id] || []).filter(function(x){ return x.line.id !== L.id; });
    // 歩いて乗り換えられる駅の路線（この駅にすでにある路線は重ねない）
    var have = {}; have[L.id] = true;
    others.forEach(function(o){ have[o.line.id] = true; });
    var walkLines = [];
    (WALKS[st.id] || []).forEach(function(w){
      (BY_STATION[w.to] || []).forEach(function(o){
        if (!have[o.line.id]){ have[o.line.id] = true; walkLines.push(o.line); }
      });
    });
    if (others.length || walkLines.length){
      var x = el("div", "xfer");
      others.forEach(function(o){ x.appendChild(mini(o.line)); });
      walkLines.forEach(function(wl){ x.appendChild(mini(wl, true)); });
      b.appendChild(x);
    }
    b.onclick = function(){ go({v:"station", id:st.id}); };
    rail.appendChild(b);
  });
  // 環状線は、最後の駅のあと最初の駅にもどることを線でつないで見せる
  if (L.loop){
    var first = STATIONS[L.stations[0].stationId];
    var lp = el("button", "stop loopend"); lp.type = "button";
    lp.style.setProperty("--c", L.color);
    var tr0 = el("div", "track"); tr0.appendChild(el("div", "loopicon", "↻"));
    lp.appendChild(tr0);
    lp.appendChild(el("div", "looptxt", "ぐるっと まわって " + first.name + " に もどる"));
    lp.onclick = function(){
      var top = rail.querySelector(".stop");
      top.classList.remove("focus"); void top.offsetWidth; top.classList.add("focus");
      var head = document.querySelector("header").getBoundingClientRect().height;
      window.scrollTo({ top: window.scrollY + top.getBoundingClientRect().top - head - 12, behavior: "smooth" });
    };
    rail.appendChild(lp);
  }
  view.appendChild(rail);

  var tl = TRAINS_OF_LINE[L.id] || [];
  if (tl.length){
    var ts = el("section", "opsec");
    ts.appendChild(el("h2", "sec", "はしる れっしゃ"));
    var tc = el("div", "card");
    tl.forEach(function(t){
      var r = el("button", "row"); r.type = "button";
      var nm = el("div", "nm");
      nm.appendChild(el("div", "kana", t.kana));
      nm.appendChild(el("div", "kanji", t.name));
      var cnt = t.stops.filter(function(x){ return x.stop === "all"; }).length;
      nm.appendChild(el("div", "sub", t.stops.length + "えきに とまる（いつも とまる " + cnt + "えき）"));
      r.appendChild(nm);
      r.appendChild(chev());
      r.onclick = function(){ go({v:"train", id:t.id}); };
      tc.appendChild(r);
    });
    ts.appendChild(tc);
    view.appendChild(ts);
  }

  if (!L.verified){
    view.appendChild(el("div", "warn",
      "⚠ この路線はまだ人の確認が済んでいません。駅の順番を路線図で確かめてください。"));
  }
  // 正式な名前が案内の名前とちがうときだけ出す（西武新宿線＝新宿線 など）
  if (L.formalName && L.formalName !== L.name){
    view.appendChild(el("div", "note", "せいしきな なまえ：" + L.formalName));
  }
}

// ③ 駅 → つながる全路線
function viewStation(id){

  if (st.subName) h.appendChild(el("div", "sub", "〈" + st.subName + "〉 " + st.subKana));
  h.appendChild(el("div", "cnt", entries.length + "ろせんが とまります" +
    (walks.length ? " ／ あるいて のりかえ " + walks.length + "えき" : "")));
  h.appendChild(favButton("stations", id));

  entries.forEach(function(e){
    var L = e.line;
    var c = el("div", "lncard"); c.style.setProperty("--c", L.color);

    var t = el("div", "t"); t.textContent = L.name;

    hd.appendChild(t);

    hd.appendChild(go2);
    c.appendChild(hd);

    var nb = el("div", "nbrs");
    [[-1, "まえの えき"], [1, "つぎの えき"]].forEach(function(p){

        var d = el("div", "nbr end");
        d.appendChild(el("div", "lbl", p[1]));

      var ns = STATIONS[next.stationId];

    var c2 = el("div", "card chipcard");

    tst.forEach(function(x){

      b.style.setProperty("--c", L0 ? L0.color : "#888");
      b.onclick = function(){ go({v:"train", id:x.train.id}); };
      chips.appendChild(b);
    });
    c2.appendChild(chips);
    if (tst.some(function(x){ return x.stop === "some"; })){
      c2.appendChild(el("div", "chiplegend", "てんせんの れっしゃは ときどき とまります"));
    }
    sec2.appendChild(c2);
    view.appendChild(sec2);

  // 駅名は違うが、歩いて乗り換えられる駅
  if (walks.length){
    var ws = el("section", "opsec walksec");
    ws.appendChild(el("h2", "sec", "🚶 あるいて のりかえ"));
    var wc = el("div", "card");
    walks.forEach(function(w){
      var to = STATIONS[w.to];
      var r = el("button", "row"); r.type = "button";
      var nmb = nameBlock(to, true);
      nmb.appendChild(el("div", "wkind", WALK_LABEL[w.kind] || ""));
      r.appendChild(nmb);
      var xx = el("div", "xfer"); xx.style.marginLeft = "auto";

      r.appendChild(xx);

// ④ 列車 → とまる駅

// 検索
function viewSearch(q){
  var k = norm(q);
  // 「い」と入れたら「い」で始まるものだけ出す（前方一致）。
  // 「いし」なら「いし」で始まるもの。五十音をたどる使いかたに合わせている
  function head(v){ var t = norm(v); return t && t.indexOf(k) === 0; }

  var ls = LINES.filter(function(L){
    return head(L.name) || head(L.kana) || norm(L.symbol) === k || head(L.formalName);
  });
  var sts = DATA.stations.filter(function(s){
    // 副称（明治神宮前〈原宿〉の「原宿」）は、それだけでも先頭から引けるようにする
    if (head(s.name) || head(s.kana) || head(s.subName) || head(s.subKana)) return true;
    return (BY_STATION[s.id] || []).some(function(e){ return head(e.numbering); });
  });

  // 新幹線の列車名（のぞみ・はやぶさ など）でも引けるようにする
  var trs = TRAINS.filter(function(t){ return head(t.name) || head(t.kana); });

  if (!ls.length && !sts.length && !trs.length){
    view.appendChild(el("div", "empty", "「" + q + "」は みつかりませんでした"));
    return;
  }
  if (trs.length){
    var s0 = el("section", "opsec");
    s0.appendChild(el("h2", "sec", "しんかんせん " + trs.length + "けん"));
    var c0 = el("div", "card");
    trs.forEach(function(t){
      var r = el("button", "row"); r.type = "button";
      var nm = el("div", "nm sm");
      nm.appendChild(el("div", "kana", t.kana));
      nm.appendChild(el("div", "kanji", t.name));
      nm.appendChild(el("div", "sub", t.stops.length + "えきに とまる"));
      r.appendChild(nm); r.appendChild(chev());
      r.onclick = function(){ go({v:"train", id:t.id}); };
      c0.appendChild(r);
    });
    s0.appendChild(c0);
    view.appendChild(s0);
  }
  if (ls.length){
    var s1 = el("section", "opsec");
    s1.appendChild(el("h2", "sec", "ろせん " + ls.length + "けん"));
    var c1 = el("div", "card");
    ls.forEach(function(L){
      var r = el("button", "row"); r.type = "button";
      r.appendChild(badge(L, null, true));
      var nm = el("div", "nm sm");
      nm.appendChild(el("div", "kana", L.kana));
      nm.appendChild(el("div", "kanji", L.name));
      r.appendChild(nm); r.appendChild(chev());
      r.onclick = function(){ go({v:"line", id:L.id}); };
      c1.appendChild(r);
    });
    s1.appendChild(c1);
    view.appendChild(s1);
  }
  if (sts.length){
    var s2 = el("section", "opsec");
    s2.appendChild(el("h2", "sec", "えき " + sts.length + "けん"));
    var c2 = el("div", "card");
    sts.forEach(function(s){
      var r = el("button", "row"); r.type = "button";
      var wrapb = el("div", "xfer"); wrapb.style.maxWidth = "none";
      (BY_STATION[s.id] || []).forEach(function(e){ wrapb.appendChild(mini(e.line)); });
      r.appendChild(nameBlock(s, true));
      wrapb.style.marginLeft = "auto";
      r.appendChild(wrapb);
      r.appendChild(chev());
      r.onclick = function(){ go({v:"station", id:s.id}); };
      c2.appendChild(r);
    });
    s2.appendChild(c2);
    view.appendChild(s2);
  }
}

// 検索ボックス
var timer = null;
function homeOp(){                     // 選んでいた事業者タブを覚えておく
  for (var i = stack.length - 1; i >= 0; i--) if (stack[i].v === "home") return stack[i].op;
  return null;
}
qbox.addEventListener("input", function(){
  clr.classList.toggle("on", !!qbox.value);
  clearTimeout(timer);
  timer = setTimeout(function(){
    var q = qbox.value.trim(), op = homeOp();
    // 文字を打つたびに履歴が増えないよう、検索に入る最初の1回だけ履歴を積む
    var already = stack.length > 1 && stack[stack.length - 1].v === "search";
    if (!q){ stack = [{ v:"home", op:op }]; resetHistory(); go(stack[0], false); return; }
    stack = [{ v:"home", op:op }, { v:"search", q:q }];
    render(stack[1]); updateNav(stack[1]); window.scrollTo(0, 0);
    if (!already) pushHistory();
  }, 120);
});
clr.onclick = function(){
  var op = homeOp();
  qbox.value = ""; clr.classList.remove("on");
  stack = [{ v:"home", op:op }]; resetHistory(); go(stack[0], false);
  qbox.focus();
};

buildTabs();
stack = [{ v:"home", op:null }];
resetHistory();
go(stack[0], false);
syncHeaderHeight();

// オフラインでも開けるようにする。file:// で直接開いたときは使えないので見送る。
// 失敗した理由は ?pwa を付けて開くと画面で確認できる（swError に控えておく）
var swError = null;
if ("serviceWorker" in navigator && location.protocol.indexOf("http") === 0){
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("./sw.js").catch(function(e){
      swError = e.name + ": " + e.message;
    });
  });
}

// ---- 診断画面（?pwa を付けて開いたときだけ出る）----
// スマホでホーム画面に追加できないときに、何が足りないのかを見るためのもの
if (/[?&]pwa/.test(location.search)){
  window.addEventListener("load", function(){ setTimeout(showPwaStatus, 1200); });
}
function showPwaStatus(){
  var rows = [];
  var add = function(k, v, good){
    rows.push('<tr><td style="padding:6px 10px;border-bottom:1px solid #dfe3ec;white-space:nowrap">' + k +
      '</td><td style="padding:6px 10px;border-bottom:1px solid #dfe3ec;word-break:break-all;' +
      (good === true ? "color:#137333" : good === false ? "color:#c5221f;font-weight:700" : "") +
      '">' + v + "</td></tr>");
  };
  var standalone = window.matchMedia("(display-mode: standalone)").matches ||
                   navigator.standalone === true;
  add("URL", location.href);
  add("安全な接続(HTTPS)", window.isSecureContext ? "はい" : "いいえ", window.isSecureContext);
  add("ServiceWorker対応", ("serviceWorker" in navigator) ? "対応" : "非対応",
      "serviceWorker" in navigator);
  add("いま独立起動中", standalone ? "はい（インストール済み）" : "いいえ（ブラウザ内）");

  var done = function(){
    var box = el("div", "card");
    box.innerHTML = '<div style="padding:14px 12px 6px;font-weight:800;font-size:16px">' +
      "PWAの状態しらべ</div><table style='width:100%;border-collapse:collapse;font-size:13px'>" +
      rows.join("") + "</table>" +
      '<div style="padding:10px 12px;font-size:12px;color:#6b7280">' +
      "この画面はURLの末尾から <code>?pwa</code> を消すと出なくなります。</div>";
    view.innerHTML = "";
    view.appendChild(box);
    tabs.classList.remove("on");
  };

  fetch("./manifest.webmanifest").then(function(r){
    add("manifest取得", r.status + " " + (r.headers.get("content-type") || ""), r.ok);
    return r.json();
  }).then(function(m){
    add("manifest内容", "name=" + m.name + " / display=" + m.display +
        " / icons=" + m.icons.length + "件", true);
  }).catch(function(e){
    add("manifest取得", "失敗 " + e.message, false);
  }).then(function(){
    if (!("serviceWorker" in navigator)) return null;
    return navigator.serviceWorker.getRegistrations();
  }).then(function(regs){
    if (regs == null) return;
    if (!regs.length){
      add("SW登録", swError ? ("失敗 — " + swError) : "登録なし（理由不明）", false);
    } else {
      var r = regs[0];
      add("SW登録", "成功", true);
      add("SW状態", r.active ? "active（動作中）" : r.installing ? "installing（準備中）" : "waiting",
          !!r.active);
      add("SWの担当範囲", r.scope);
    }
    add("ページの管理", navigator.serviceWorker.controller ? "SWが管理中" :
        "まだ管理していない（再読み込みで変わります）", !!navigator.serviceWorker.controller);
    return caches.keys();
  }).then(function(keys){
    if (keys) add("保存済みの箱", keys.length ? keys.join(", ") : "まだ無い", keys.length > 0);
  }).catch(function(e){
    add("しらべ中のエラー", e.message, false);
  }).then(done, done);
}
})();
</script>
