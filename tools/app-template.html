<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>首都圏てつどうずかん</title>
<meta name="description" content="首都圏の鉄道と全国の新幹線を、漢字とふりがなで調べられる図鑑。">
<!-- ホーム画面に置いてアプリのように使うための設定 -->
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#ffc93c">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="てつどうずかん">
<style>
  :root{
    --bg:#eef1f7; --card:#ffffff; --ink:#1b1f2a; --muted:#6b7280;
    --line:#dfe3ec; --accent:#2f6df6; --radius:16px;
    --shadow:0 1px 2px rgba(20,25,40,.06), 0 6px 18px rgba(20,25,40,.06);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic UI","Meiryo",system-ui,sans-serif;
    line-height:1.5; -webkit-text-size-adjust:100%;
    /* 指で押したときの青いちらつきを消し、自前の反応色だけを見せる */
    -webkit-tap-highlight-color:transparent;
  }
  .wrap{max-width:760px;margin:0 auto;padding:0 14px 64px}

  /* ---- ヘッダー ---- */
  header{
    position:sticky; top:0; z-index:20; background:rgba(238,241,247,.94);
    backdrop-filter:blur(8px); border-bottom:1px solid var(--line);
  }
  .hd{max-width:760px;margin:0 auto;padding:10px 14px 12px}
  .hd-top{display:flex;align-items:center;gap:8px;min-height:40px}
  .brand{font-size:19px;font-weight:800;letter-spacing:.02em;min-width:0}
  .brand small{display:block;font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.08em}
  /* 路線・駅を見ているときは、いま何を見ているかを題名に出す。
     ボタンが2つ並ぶので、題名は小さくして1行に収める */
  .hd-top.nav .brand{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .hd-top.nav .brand small{display:none}
  .navbtn{
    appearance:none;border:1px solid var(--line);background:var(--card);color:var(--ink);
    font:inherit;font-size:14px;font-weight:700;padding:9px 13px;border-radius:999px;cursor:pointer;
    display:none;align-items:center;gap:4px;white-space:nowrap;flex:none;min-height:40px;
  }
  .navbtn:hover{background:#f3f5fa}
  .navbtn:active{background:#e2e8f8}
  .navbtn.on{display:inline-flex}

  /* ---- 事業者タブ（横スクロール） ---- */
  .tabs{
    display:none;gap:8px;overflow-x:auto;overflow-y:hidden;
    max-width:760px;margin:0 auto;padding:0 14px 10px;
    -webkit-overflow-scrolling:touch;scrollbar-width:none;
  }
  .tabs::-webkit-scrollbar{display:none}
  .tabs.on{display:flex}
  .tab{
    flex:none;appearance:none;border:1px solid var(--line);background:var(--card);color:var(--ink);
    font:inherit;font-size:14px;font-weight:700;padding:8px 15px;border-radius:999px;
    cursor:pointer;white-space:nowrap;min-height:44px;   /* 指で押しやすい大きさ */
  }
  .tab:active{background:#e2e8f8}
  .tab.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .search{position:relative;margin-top:10px}
  .search input{
    width:100%;font:inherit;font-size:16px;padding:12px 40px 12px 40px;
    border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--ink);
    box-shadow:var(--shadow);
  }
  .search input:focus{outline:2px solid var(--accent);outline-offset:1px}
  .search .ico{position:absolute;left:14px;top:50%;transform:translateY(-50%);opacity:.45}
  .search .clr{
    position:absolute;right:8px;top:50%;transform:translateY(-50%);
    border:0;background:#e6e9f2;color:#555;border-radius:50%;width:26px;height:26px;
    font:inherit;font-size:15px;line-height:1;cursor:pointer;display:none;
  }
  .search .clr.on{display:block}

  /* ---- 共通パーツ ---- */
  /* 事業者の見出し。分類でしぼると1画面に収まらないことがあるので、
     スクロール中もどの事業者を見ているか分かるよう上部に貼りつける。
     .opsec で1事業者ずつ囲ってあるので、見出しが積み重なることはない */
  .opsec{margin-top:14px}
  h2.sec{
    position:sticky; top:calc(var(--hh, 177px) - 1px); z-index:5;
    font-size:13px;font-weight:800;color:var(--muted);letter-spacing:.12em;
    margin:0;padding:8px 0;background:var(--bg);
  }
  .card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
  .row{
    display:flex;align-items:center;gap:12px;width:100%;text-align:left;
    padding:14px;border:0;border-top:1px solid var(--line);background:none;
    font:inherit;color:inherit;cursor:pointer;min-height:66px;
  }
  .row:first-child{border-top:0}
  .row:hover{background:#f5f7fc}
  .row:active{background:#e2e8f8}
  .row .chev{margin-left:auto;color:#c3c8d4;font-size:20px;flex:none}

  /* 駅名: ひらがなを上、漢字を下に置く */
  .nm{min-width:0}
  .nm .kana{font-size:12px;color:var(--muted);letter-spacing:.04em;line-height:1.25}
  .nm .kanji{font-size:19.5px;font-weight:700;letter-spacing:.01em;line-height:1.3}
  .nm .sub{font-size:12px;color:var(--muted);font-weight:600}
  .nm.sm .kanji{font-size:17px}

  /* 路線記号バッジ（自前描画・公式ロゴは使わない） */
  .badge{
    flex:none;width:44px;height:44px;border-radius:50%;background:#fff;
    border:3.5px solid var(--c);display:flex;flex-direction:column;
    align-items:center;justify-content:center;color:var(--c);line-height:1;
  }
  .badge .s{font-size:11px;font-weight:800;letter-spacing:.02em}
  .badge .n{font-size:15px;font-weight:800;margin-top:1px;font-variant-numeric:tabular-nums}
  .badge.only .s{font-size:19px}
  .badge.sm{width:36px;height:36px;border-width:3px}
  .badge.sm .s{font-size:9px} .badge.sm .n{font-size:12.5px}
  .badge.sm.only .s{font-size:16px}
  /* 駅ナンバリングが無い路線は、記号のかわりに路線カラーの丸を出す */
  .badge.dot{background:var(--c);border-color:#fff;box-shadow:0 0 0 3.5px var(--c)}
  .badge.dot.sm{box-shadow:0 0 0 3px var(--c)}
  .mini.dot{background:var(--c2);border-color:#fff;box-shadow:0 0 0 2.5px var(--c2)}

  .pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700;color:#fff;background:var(--c)}

  /* ---- 路線ヘッダー ---- */
  .lhead{display:flex;align-items:center;gap:14px;padding:16px;background:var(--card);
         border-radius:var(--radius);box-shadow:var(--shadow);border-left:8px solid var(--c)}
  .lhead .t{min-width:0}
  .lhead .t .kana{font-size:12px;color:var(--muted)}
  .lhead .t .nm2{font-size:23px;font-weight:800;line-height:1.25}
  .lhead .t .meta{font-size:12px;color:var(--muted);margin-top:3px}
  .swatch{width:13px;height:13px;border-radius:4px;background:var(--c);display:inline-block;
          vertical-align:-2px;margin-right:5px}

  /* ---- 駅リスト（縦のレール） ---- */
  .rail{position:relative;background:var(--card);border-radius:var(--radius);
        box-shadow:var(--shadow);padding:6px 0;margin-top:12px}
  .stop{display:flex;align-items:center;gap:13px;width:100%;text-align:left;
        padding:11px 14px;border:0;background:none;font:inherit;color:inherit;cursor:pointer;position:relative;
        min-height:64px}
  .stop:hover{background:#f5f7fc}
  .stop:active{background:#e2e8f8}
  /* 駅詳細から路線にもどってきたとき、その駅を一瞬光らせて居場所を知らせる */
  @keyframes findme{
    0%,60%{background:#fff3bf}
    100%{background:transparent}
  }
  .stop.focus{animation:findme 2.4s ease-out}
  .stop.focus .nm .kanji{color:#8a6d00}
  .track{position:relative;flex:none;width:44px;display:flex;justify-content:center}
  /* 駅と駅をつなぐ線 */
  .stop::before{content:"";position:absolute;left:calc(14px + 22px - 3px);top:0;bottom:0;
                width:6px;background:var(--c)}
  .stop:first-child::before{top:50%}
  .stop:last-child::before{bottom:50%}
  .stop .track > *{position:relative;z-index:1}
  .xfer{margin-left:auto;display:flex;flex-wrap:wrap;gap:4px;justify-content:flex-end;max-width:44%}
  .xfer .mini{width:22px;height:22px;border-radius:50%;border:2.5px solid var(--c2);background:#fff;
              color:var(--c2);font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center}

  /* ---- 駅詳細 ---- */
  .shead{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 16px}
  .shead .kana{font-size:14px;color:var(--muted);letter-spacing:.06em}
  .shead .kanji{font-size:31px;font-weight:800;line-height:1.2}
  .shead .sub{font-size:14px;color:var(--muted);font-weight:700;margin-top:2px}
  .shead .cnt{font-size:13px;color:var(--muted);margin-top:8px}
  .lncard{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);
          margin-top:11px;padding:13px 14px;border-left:8px solid var(--c)}
  .lncard .hd2{display:flex;align-items:center;gap:11px}
  .lncard .hd2 .t{font-size:17px;font-weight:800}
  .lncard .hd2 .t small{display:block;font-size:11px;font-weight:600;color:var(--muted)}
  .lncard .go{margin-left:auto;border:1px solid var(--line);background:#fff;color:var(--ink);
              font:inherit;font-size:12px;font-weight:700;padding:6px 11px;border-radius:999px;cursor:pointer}
  .lncard .go:hover{background:#f3f5fa}
  .nbrs{display:flex;gap:8px;margin-top:11px;font-size:12.5px}
  .nbr{flex:1;min-width:0;background:#f5f7fc;border-radius:11px;padding:10px;
       border:0;font:inherit;text-align:left;cursor:pointer;color:inherit;min-height:52px}
  .nbr:hover{background:#eaeefa}
  .nbr:active{background:#dde4f7}
  .nbr .lbl{font-size:10.5px;color:var(--muted);font-weight:700;letter-spacing:.06em}
  .nbr .v{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .nbr.end{color:var(--muted);cursor:default;background:#f7f8fb}
  .nbr.end:hover{background:#f7f8fb}

  /* 歩いて乗り換える駅。同じ駅の乗換と見分けられるよう点線の丸にする */
  .xfer .mini.walk{border-style:dashed}
  .xfer .mini.dot.walk{box-shadow:none;border:2.5px dashed var(--c2)}
  .walksec{margin-top:18px}
  .walksec .wkind{font-size:11.5px;color:#2f6df6;font-weight:700;margin-top:2px}

  /* 列車の停車駅。いつも停まる駅は塗りつぶし、ときどきの駅は白抜きにする */
  .tdot{flex:none;width:22px;height:22px;border-radius:50%;background:var(--c);
        border:3px solid var(--c);position:relative;z-index:1}
  .stop.sometimes .tdot{background:#fff}
  .stop.sometimes .nm .kanji{color:var(--muted)}
  .stop .wkind{margin-left:auto;font-size:11.5px;color:var(--muted);font-weight:700}

  /* 「ろせんを見る」は指で押しやすい大きさに */
  .lncard .go{padding:9px 14px;font-size:13px;min-height:40px}
  /* 新幹線の丸に入る「新」の字 */
  .badge.dot{color:#fff;font-weight:800;font-size:17px}
  .badge.dot.sm{font-size:14px}
  .xfer .mini.dot{color:#fff;font-size:11px}
  /* 環状線 */
  .loopmark{color:var(--c)}
  .stop.loopend{min-height:54px}
  .loopicon{width:32px;height:32px;border-radius:50%;background:#fff;border:3px solid var(--c);
            color:var(--c);display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:800}
  .looptxt{font-size:14px;font-weight:700;color:var(--muted)}
  /* 横に並ぶボタン（とまる新幹線・すきな路線と駅） */
  .chipcard{padding:12px}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{appearance:none;font:inherit;font-size:15px;font-weight:800;padding:8px 14px;min-height:44px;
        border-radius:999px;border:2.5px solid var(--c,#2f6df6);background:#fff;color:var(--ink);cursor:pointer}
  .chip:active{background:#e2e8f8}
  .chip.some{border-style:dashed;color:var(--muted)}
  .chip.sta{--c:#aab2c3}
  .chiplegend{font-size:11.5px;color:var(--muted);margin-top:10px}
  /* 直通運転。相手の路線の色で、いつもは実線、ときどきは点線 */
  .thrchain{align-items:center}
  .thrarrow{color:var(--muted);font-weight:800}
  .chip.me{background:var(--c);color:#fff;cursor:default}
  .thrtag{display:inline-block;margin-top:3px;font-size:11px;font-weight:800;color:var(--ink);
          border:2px solid var(--c2);border-radius:999px;padding:1px 8px;background:#fff}
  .stop.thru{min-height:56px}
  .stop.thru .nm .kanji{font-size:15.5px}
  .stop.thru .nm .kana{color:var(--c2);font-weight:800}
  .stop.thru.end.some::before{background:repeating-linear-gradient(to bottom,var(--c) 0 6px,transparent 6px 11px)}
  .thrmark{width:26px;height:26px;border-radius:50%;background:#fff;border:3px solid var(--c2);color:var(--c2);
           font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center}
  .stop.thru.some .thrmark{border-style:dashed}
  .nbr.thrnbr{background:#fff;border:2px solid var(--c2)}
  .nbr.thrnbr .v{white-space:normal;font-size:13px;line-height:1.35}
  .stop.thru .chev{margin-left:auto}
  .chip.far{font-size:13.5px;padding:6px 11px;min-height:38px}
  .thrfargrp{display:inline-flex;flex-wrap:wrap;align-items:center;gap:4px}
  .thrdot{color:var(--muted);font-weight:800}
  .thrchain + .thrchain{margin-top:10px;padding-top:10px;border-top:1px dashed #d5dbe8}
  .stop.viastop{min-height:52px}
  .stop.viastop .nm .kanji{font-size:16px}
  .stop.viastop .nm .sub{color:var(--muted)}
  .viachips{display:flex;flex-wrap:wrap;align-items:center;gap:5px;margin-top:6px}
  .viachips .lbl{font-size:11px;color:var(--muted);font-weight:700}
  .viachip{appearance:none;font:inherit;font-size:12.5px;font-weight:800;padding:4px 9px;min-height:32px;
           border-radius:999px;border:2px solid var(--c2);background:#fff;color:var(--ink);cursor:pointer}
  .viachip:active{background:#e2e8f8}
  .stop.thru{cursor:pointer}
  .stop.thru .nm .sub.farto{color:var(--ink);font-weight:700}
  .thrgroup{margin-top:11px;border:2px solid #c9d1e3;border-radius:calc(var(--radius) + 6px);padding:0 6px 6px;background:#eef2fa}
  .thrgroup > .lncard{margin-top:6px}
  .thrconn{text-align:center;font-size:12.5px;font-weight:800;color:var(--ink);padding:7px 4px 1px}
  .thrconn.some{color:var(--muted)}
  .thrgap{height:2px}
  .thrfoot{font-size:12px;color:var(--muted);padding:8px 6px 2px;line-height:1.6}
  /* 特急の「いきさき」ボタン。選んでいるものは路線の色でぬる */
  .chip.dest{display:flex;flex-direction:column;align-items:flex-start;line-height:1.2;padding:6px 14px}
  .chip.dest .k{font-size:10.5px;font-weight:700;color:var(--muted)}
  .chip.dest .j{font-size:15px}
  .chip.dest.on{background:var(--c);color:#fff}
  .chip.dest.on .k{color:rgba(255,255,255,.85)}
  /* アプリに無い区間へ続く行。線を点線にして「この先もある」ことを見せる */
  .stop.cont{cursor:default}
  .stop.cont:hover,.stop.cont:active{background:none}
  .stop.cont::before{background:repeating-linear-gradient(to bottom,var(--c) 0 6px,transparent 6px 11px);bottom:50%}
  .contmark{width:22px;height:22px;border-radius:50%;background:#fff;border:3px dashed var(--c);
            color:var(--c);font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center}
  .stop.cont .nm .kanji{color:var(--muted)}
  /* すき（お気に入り） */
  .favbtn{appearance:none;flex:none;font:inherit;font-size:13px;font-weight:800;padding:8px 13px;min-height:40px;
          border-radius:999px;border:1.5px solid #e6c34a;background:#fff;color:#8a6d00;cursor:pointer}
  .favbtn.on{background:#ffe27a;border-color:#e0b000}
  .favbtn:active{background:#fff3bf}
  .lhead .favbtn{margin-left:auto;align-self:flex-start}
  .shead .favbtn{margin-top:10px}
  /* タブがまだ右にあることを、右はしを薄くして知らせる */
  .tabs{-webkit-mask-image:linear-gradient(to right,#000 calc(100% - 40px),transparent);
        mask-image:linear-gradient(to right,#000 calc(100% - 40px),transparent)}
  .tabs.end{-webkit-mask-image:none;mask-image:none}

  .empty{text-align:center;color:var(--muted);padding:40px 16px;font-size:14px}
  .note{font-size:11.5px;color:var(--muted);margin-top:26px;line-height:1.7;text-align:center}
  .warn{background:#fff8e6;border:1px solid #f2dfa8;color:#7a5c00;border-radius:12px;
        padding:9px 12px;font-size:12px;margin-top:12px}
  @media (max-width:430px){
    /* スマホでは英字の副題を出さない。子どもには読めず、画面が狭くなるだけなので */
    .brand small{display:none}
    .brand{font-size:18px}
    .xfer{max-width:38%}
  }
  @media (max-height:500px){
    /* スマホを横に倒したとき。ヘッダーを詰めて一覧を見る場所を確保する */
    .brand small{display:none}
    .brand{font-size:17px}
    .hd{padding:6px 14px 7px}
    .search{margin-top:7px}
    .search input{padding:9px 40px}
    .tabs{padding-bottom:7px}
    .tab{min-height:38px;padding:6px 14px}
  }
  /* iPhoneのノッチ（切り欠き）やホームバーに文字が隠れないようにする */
  .hd, .tabs{padding-left:max(14px, env(safe-area-inset-left));padding-right:max(14px, env(safe-area-inset-right))}
  .wrap{padding-left:max(14px, env(safe-area-inset-left));padding-right:max(14px, env(safe-area-inset-right));
        padding-bottom:calc(64px + env(safe-area-inset-bottom))}
</style>
</head>
<body>
<header>
  <div class="hd">
    <div class="hd-top" id="hdtop">
      <button class="navbtn" id="back" type="button">‹ もどる</button>
      <button class="navbtn" id="top" type="button">トップ</button>
      <div class="brand" id="brand">首都圏てつどうずかん<small>SHUTOKEN TETSUDO ZUKAN</small></div>
    </div>
    <div class="search">
      <span class="ico">🔍</span>
      <input id="q" type="search" inputmode="search" autocomplete="off"
             placeholder="えきや ろせんを さがす">
      <button class="clr" id="clr" type="button" aria-label="消す">×</button>
    </div>
  </div>
  <div class="tabs" id="tabs"></div>
</header>

<div class="wrap" id="view"></div>

<script id="data" type="application/json">__RAILWAY_DATA__</script>
<script>
(function(){
"use strict";
var DATA = JSON.parse(document.getElementById("data").textContent);
var LINES = DATA.lines, STATIONS = {}, OPS = {};
DATA.stations.forEach(function(s){ STATIONS[s.id] = s; });
DATA.operators.forEach(function(o){ OPS[o.id] = o; });

// 駅 -> その駅を通る路線
var BY_STATION = {};
LINES.forEach(function(L){
  L.stations.forEach(function(e, i){
    (BY_STATION[e.stationId] || (BY_STATION[e.stationId] = [])).push({line:L, idx:i, numbering:e.numbering});
  });
});

// 駅 → 歩いて乗り換えられる別名の駅（data/transfers.json 由来）
var WALKS = {};
(DATA.walks || []).forEach(function(w){
  var a = w.stations[0], b = w.stations[1];
  (WALKS[a] || (WALKS[a] = [])).push({to:b, kind:w.kind});
  (WALKS[b] || (WALKS[b] = [])).push({to:a, kind:w.kind});
});
var WALK_LABEL = {
  "same-facility": "すぐ となり",
  "passage": "ちかの みちで つながっている",
  "official": "のりかえ できる えき",
  "near": "あるいて すぐ"
};

// 新幹線の列車（のぞみ・はやぶさ など）
var TRAINS = DATA.trains || [];
var TRAINS_OF_LINE = {}, TRAINS_OF_STATION = {};
TRAINS.forEach(function(t){
  (t.lines || []).forEach(function(lid){ (TRAINS_OF_LINE[lid] || (TRAINS_OF_LINE[lid] = [])).push(t); });
  (t.stops || []).forEach(function(s){
    (TRAINS_OF_STATION[s.stationId] || (TRAINS_OF_STATION[s.stationId] = [])).push({train:t, stop:s.stop});
  });
});

// 有料の特急（スカイライナー・ロマンスカー・スペーシアX など）。いきさきごとに停車駅を持つ。
// 停車駅には、その駅にどの路線で着くか（lineId）がビルド時に付いている
var EXPRESSES = DATA.expresses || [];
var EXP_BY_ID = {}, EXP_OF_LINE = {}, EXP_OF_STATION = {};
EXPRESSES.forEach(function(e){
  EXP_BY_ID[e.id] = e;
  var seenL = {}, best = {}, order = [];
  e.variants.forEach(function(v){
    v.lines.forEach(function(lid){
      if (seenL[lid]) return;
      seenL[lid] = true;
      (EXP_OF_LINE[lid] || (EXP_OF_LINE[lid] = [])).push(e);
    });
    // どれか1つのいきさきで「いつも」とまるなら、駅の画面では「いつも」として出す
    v.stops.forEach(function(s){
      if (!(s.stationId in best)) order.push(s.stationId);
      if (best[s.stationId] !== "all") best[s.stationId] = s.stop;
    });
  });
  order.forEach(function(sid){
    (EXP_OF_STATION[sid] || (EXP_OF_STATION[sid] = [])).push({exp:e, stop:best[sid]});
  });
});

// 会社をまたぐ直通運転（data/through.json）。路線ごとに「どの駅で、どの路線へ、そのまま行けるか」を持つ。
//   at: この路線の境目の駅 / other: 相手の路線 / otherAt: 相手の路線の境目の駅
//   go: この路線の電車が相手へ入るか（all いつも / some ときどき / none 入らない）
//   to: 直通の電車がよく行く先（{station, line}） / via: 間でとおる短い路線
//   next: 境目の駅で、線路がすぐにつながる路線（相手の路線か、間の短い路線）
//   reach: 直通の電車が走っていく路線（相手の路線から順に） / gapAt: とおり道のうちアプリに無い区間がおわる駅
var THR_OF_LINE = {};
function addThr(lineId, x){
  var a = THR_OF_LINE[lineId] || (THR_OF_LINE[lineId] = []);
  // とおり道の路線は、いくつものつながりに出てくる（西武有楽町線→池袋線 が2回など）。1つにまとめる
  for (var i = 0; i < a.length; i++){
    var y = a[i];
    if (y.other === x.other && y.at === x.at){
      if (x.go === "all" || (x.go === "some" && y.go === "none")) y.go = x.go;
      x.to.forEach(function(t){
        if (!y.to.some(function(u){ return u.station === t.station; })) y.to.push(t);
      });
      x.reach.forEach(function(r){ if (y.reach.indexOf(r) < 0) y.reach.push(r); });
      return;
    }
  }
  a.push(x);
}
function lineHas(lineId, sid){
  var L = lineById(lineId);
  return !!L && L.stations.some(function(e){ return e.stationId === sid; });
}
// とおり道の路線 v が、隣（路線 n か、そのまた先の駅 s）とつながる駅
function meetOn(v, n, s){
  if (lineHas(v, s)) return s;
  var LV = lineById(v), LN = lineById(n);
  for (var i = 0; LV && LN && i < LV.stations.length; i++){
    var sid = LV.stations[i].stationId;
    if (LN.stations.some(function(e){ return e.stationId === sid; })) return sid;
  }
  return null;
}
(DATA.throughs || []).forEach(function(k){
  var a = k.sides[0], b = k.sides[1], via = k.via || [];
  var ra = (a.reach || []).slice(), rb = (b.reach || []).slice();
  addThr(a.line, { at:a.station, other:b.line, otherAt:b.station, go:a.go, to:(a.to || []).slice(), reach:ra,
                   via:via, next:via[0] || b.line, gapAt:k.gapAt });
  addThr(b.line, { at:b.station, other:a.line, otherAt:a.station, go:b.go, to:(b.to || []).slice(), reach:rb,
                   via:via.slice().reverse(), next:via[via.length - 1] || a.line });
  // とおり道の路線（西武有楽町線など）からは、両側の路線が直通の相手になる。
  // a 側へ向かうのは b 側から来た電車なので、go と to は b のものを使う
  via.forEach(function(v, i){
    var towardA = i === 0 ? (k.gapAt && !lineHas(v, a.station) ? k.gapAt : meetOn(v, a.line, a.station)) : meetOn(v, via[i - 1], a.station);
    var towardB = i === via.length - 1 ? meetOn(v, b.line, b.station) : meetOn(v, via[i + 1], b.station);
    if (towardA) addThr(v, { at:towardA, other:a.line, otherAt:a.station, go:b.go, to:(b.to || []).slice(), reach:rb.slice(),
                             via:via.slice(0, i).reverse(), next:i === 0 ? a.line : via[i - 1] });
    if (towardB) addThr(v, { at:towardB, other:b.line, otherAt:b.station, go:a.go, to:(a.to || []).slice(), reach:ra.slice(),
                             via:via.slice(i + 1), next:i === via.length - 1 ? b.line : via[i + 1] });
  });
});

// 直通の電車が入ってくるのに、直通の相手としてはつながっていない路線（東武伊勢崎線・京急空港線 など）。
// 路線id -> その路線まで電車が来る、出発側の路線idの並び
var THR_INCOMING = {};
(DATA.throughs || []).forEach(function(k){
  var chain = [k.sides[0].line, k.sides[1].line].concat(k.via || []);
  k.sides.forEach(function(s){
    (s.reach || []).forEach(function(r){
      if (chain.indexOf(r) >= 0) return;
      var a = THR_INCOMING[r] || (THR_INCOMING[r] = []);
      if (a.indexOf(s.line) < 0) a.push(s.line);
    });
  });
});

// ---- ちいさな道具 ----
function el(tag, cls, txt){
  var n = document.createElement(tag);
  if (cls) n.className = cls;
  if (txt != null) n.textContent = txt;
  return n;
}
function kataToHira(s){
  return s.replace(/[ァ-ヶ]/g, function(c){
    return String.fromCharCode(c.charCodeAt(0) - 0x60);
  });
}
// 同じ字の書き分け。駅名は事業者の表記（螢田・西ヶ原四丁目など）に合わせてあるが、
// 検索では「蛍田」「西ケ原」と打っても見つかるように、どちらも同じ字にそろえて比べる
var FOLD = { "ヶ": "ケ", "ヵ": "カ", "螢": "蛍", "屛": "屏", "麴": "麹" };
function norm(s){
  var t = String(s || "");
  // 半角カタカナ・全角英数を先に寄せてから、カタカナをひらがなに直す
  try { t = t.normalize("NFKC"); } catch (e) {}
  t = t.replace(/[ヶヵ螢屛麴]/g, function(c){ return FOLD[c]; });
  return kataToHira(t.toLowerCase()).replace(/[\s　\-‐－・]/g, "");
}
function fullName(st){ return st.name + (st.subName ? "〈" + st.subName + "〉" : ""); }
function fullKana(st){ return st.kana + (st.subKana ? "〈" + st.subKana + "〉" : ""); }

// 駅名ブロック（ひらがなを上、漢字を下）
function nameBlock(st, small){
  var b = el("div", "nm" + (small ? " sm" : ""));
  b.appendChild(el("div", "kana", st.kana));
  var k = el("div", "kanji", st.name);
  b.appendChild(k);
  if (st.subName){
    b.appendChild(el("div", "sub", "〈" + st.subName + "〉 " + st.subKana));
  }
  return b;
}
// 記号を持たない路線の丸に入れる字。新幹線は色だけの丸が4つ5つ並ぶと
// どれが新幹線か分からないので「新」を入れる。それ以外は色だけのまま
function dotLabel(line){ return line.category === "shinkansen" ? "新" : ""; }
// 路線記号バッジ
// 駅ナンバリングが無い路線（総武本線など）は記号を持たないので、路線カラーの丸を出す
function badge(line, numbering, small){
  var m = /^([A-Za-z]+)(\d+)$/.exec(numbering || "");
  if (!m && !line.symbol){
    var d = el("div", "badge dot" + (small ? " sm" : ""), dotLabel(line) || null);
    d.style.setProperty("--c", line.color);
    d.title = line.name;
    return d;
  }
  var b = el("div", "badge" + (small ? " sm" : "") + (m ? "" : " only"));
  b.style.setProperty("--c", line.color);
  b.appendChild(el("div", "s", m ? m[1] : line.symbol));
  if (m) b.appendChild(el("div", "n", m[2]));
  return b;
}
// 乗りかえ表示用の小さい丸。記号が無い路線は色だけの丸にする
function mini(line, walk){
  var m = el("div", "mini" + (line.symbol ? "" : " dot") + (walk ? " walk" : ""), line.symbol || dotLabel(line));
  m.style.setProperty("--c2", line.color);
  m.title = line.name;
  return m;
}
// 路線上で step だけ進んだ駅。環状線（山手線・大阪環状線）は端から反対の端へつながる
function neighbor(L, idx, step){
  var j = idx + step, n = L.stations.length;
  if (L.loop) j = (j + n) % n;
  return L.stations[j];
}
// 「JY02 神田」のような表示。駅番号が無ければ駅名だけ
function stopLabel(entry, st){ return (entry.numbering ? entry.numbering + " " : "") + st.name; }
function chev(){ return el("div", "chev", "›"); }

// ---- 特急の小さな道具 ----
// 特急の色は、いちばん多く停車駅がある路線の色（ロマンスカーなら小田原線の色）
function expColor(e){
  var cnt = {}, best = null;
  e.variants[0].stops.forEach(function(s){
    cnt[s.lineId] = (cnt[s.lineId] || 0) + 1;
    if (!best || cnt[s.lineId] > cnt[best]) best = s.lineId;
  });
  var L = lineById(best);
  return L ? L.color : "#888";
}
function expBadge(e, small){
  var d = el("div", "badge dot" + (small ? " sm" : ""), "特");
  d.style.setProperty("--c", expColor(e));
  return d;
}
// いきさきの呼び名。名前があればそれ（スーパーはこね・大船 から）、無ければ「終点の駅名 ゆき」。
// アプリに無い区間へ続くいきさきは、その先の駅名（修善寺 ゆき）
function variantLabel(v){
  if (v.name) return { kana: v.kana || kataToHira(v.name), kanji: v.name };
  if (v.continues && !v.continues.some) return { kana: v.continues.kana + " ゆき", kanji: v.continues.name + " ゆき" };
  var last = STATIONS[v.stops[v.stops.length - 1].stationId];
  return { kana: last.kana + " ゆき", kanji: last.name + " ゆき" };
}
function expDests(e){
  var seen = {}, out = [];
  e.variants.forEach(function(v){
    var last = STATIONS[v.stops[v.stops.length - 1].stationId].name;
    var ns = !v.continues ? [last] : v.continues.some ? [last, v.continues.name] : [v.continues.name];
    ns.forEach(function(n){ if (!seen[n]){ seen[n] = true; out.push(n); } });
  });
  return out.join("・") + " ゆき";
}
function expRow(e){
  var r = el("button", "row"); r.type = "button";
  r.appendChild(expBadge(e));
  var nm = el("div", "nm");
  nm.appendChild(el("div", "kana", e.kana));
  nm.appendChild(el("div", "kanji", e.name));
  nm.appendChild(el("div", "sub", (e.car ? e.car + " ・ " : "") + expDests(e)));
  r.appendChild(nm);
  r.appendChild(chev());
  r.onclick = function(){ go({v:"express", id:e.id, vi:0}); };
  return r;
}
// 路線・駅の画面に出す、特急のボタンの並び
function expChips(list, title){
  var sec = el("section", "opsec");
  sec.appendChild(el("h2", "sec", title));

}

// ---- 画面 ----
var view  = document.getElementById("view");
var back  = document.getElementById("back");
var topBtn= document.getElementById("top");
var hdtop = document.getElementById("hdtop");
var brand = document.getElementById("brand");
var tabs  = document.getElementById("tabs");
var qbox  = document.getElementById("q");
var clr   = document.getElementById("clr");
var stack = [];

// スマホの「戻る」（Androidの戻るボタン／iOSのスワイプ）でも1画面ずつもどれるように、
// 画面を進むたびに履歴を1つ積む。file:// で開くと使えない環境もあるので必ず try で囲む
function pushHistory(){
  try { history.pushState({ d: stack.length }, ""); } catch (e) {}
}
function resetHistory(){
  try { history.replaceState({ d: 1 }, ""); } catch (e) {}
}
window.addEventListener("popstate", function(e){
  var d = (e.state && e.state.d) || 1;
  while (stack.length > d) stack.pop();
  var s = stack[stack.length - 1];
  render(s); updateNav(s); window.scrollTo(0, s.y || 0);
});

// 画面を離れるときスクロール位置を覚えておき、もどったら同じ場所を出す
function go(state, push){
  var isPush = (push !== false);
  if (isPush){
    if (stack.length) stack[stack.length - 1].y = window.scrollY;
    stack.push(state);
    pushHistory();
  }
  render(state);
  updateNav(state);
  // 駅からその路線を開いたときは、その駅まで送って光らせる
  var spot = (isPush && state.v === "line" && state.focus)
    ? view.querySelector(".stop.focus") : null;
  if (spot){
    var head = document.querySelector("header").getBoundingClientRect().height;
    window.scrollTo(0, Math.max(0, window.scrollY + spot.getBoundingClientRect().top - head - 12));
  } else {
    window.scrollTo(0, state.y || 0);
  }
}
back.onclick = function(){
  if (stack.length <= 1) return;
  // 履歴が使えるなら history.back() に任せる（popstate 側で画面をもどす）。
  // 使えない環境では自前でもどす
  var before = stack.length;
  try { history.back(); } catch (e) {}
  setTimeout(function(){
    if (stack.length === before){ stack.pop(); go(stack[stack.length - 1], false); }
  }, 60);
};
topBtn.onclick = function(){
  qbox.value = ""; clr.classList.remove("on");
  var op = null;                       // 選んでいた事業者タブは保ったままにする
  for (var i = stack.length - 1; i >= 0; i--){ if (stack[i].v === "home"){ op = stack[i].op; break; } }
  stack = [{ v:"home", op:op }];
  resetHistory();
  go(stack[0], false);
};

// 見出しとボタンの出しわけ。いま何を見ているかを題名に出す
function updateNav(s){
  var isHome = (s.v === "home");
  back.classList.toggle("on", stack.length > 1);
  topBtn.classList.toggle("on", !isHome);
  hdtop.classList.toggle("nav", !isHome);
  tabs.classList.toggle("on", isHome);
  if (isHome){
    brand.innerHTML = "首都圏てつどうずかん<small>SHUTOKEN TETSUDO ZUKAN</small>";
  } else if (s.v === "line"){
    var L = lineById(s.id);
    brand.textContent = L ? L.name : "ろせん";
  } else if (s.v === "station"){
    var st = STATIONS[s.id];
    brand.textContent = st ? st.name + " えき" : "えき";
  } else if (s.v === "train"){
    var tr = null;
    for (var i = 0; i < TRAINS.length; i++) if (TRAINS[i].id === s.id) tr = TRAINS[i];
    brand.textContent = tr ? tr.name : "れっしゃ";
  } else if (s.v === "express"){
    var ex = EXP_BY_ID[s.id];
    brand.textContent = ex ? ex.name : "とっきゅう";
  } else {
    brand.textContent = "けんさく";
  }
  syncHeaderHeight();   // タブの出し入れで高さが変わるので貼りつけ位置を取り直す
}

function lineById(id){
  for (var i = 0; i < LINES.length; i++) if (LINES[i].id === id) return LINES[i];
  return null;
}

function render(s){
  view.innerHTML = "";
  if (s.v === "home")    return viewHome(s.op);
  if (s.v === "line")    return viewLine(s.id, s.focus);
  if (s.v === "station") return viewStation(s.id);
  if (s.v === "train")   return viewTrain(s.id);
  if (s.v === "express") return viewExpress(s.id, s.vi || 0);
  if (s.v === "search")  return viewSearch(s.q);
}

// ---- 大分類タブ ----
// JR／地下鉄／私鉄／モノレール・新交通／その他 の5つ。事業者ではなく種類でまとめる
function buildTabs(){
  var list = [{ id:null, label:"ぜんぶ" }];
  DATA.categories.forEach(function(c){
    list.push(c);
    // 特急は路線の分類ではないので、ビルドの分類表には入れず新幹線のとなりに足す
    if (c.id === "shinkansen" && EXPRESSES.length) list.push({ id:"express", label:"特急" });
  });
  list.forEach(function(t){
    var b = el("button", "tab", t.label); b.type = "button";
    b.dataset.cat = t.id == null ? "" : t.id;
    b.onclick = function(){ selectCat(t.id); };
    tabs.appendChild(b);
  });
}
function selectCat(catId){
  var s = stack[stack.length - 1];
  if (s.v !== "home"){ go({ v:"home", op:catId }); return; }
  s.op = catId; s.y = 0;               // タブの切りかえで履歴は増やさない
  render(s); markTabs(catId);
  window.scrollTo(0, 0);
}
function tabsEnd(){
  tabs.classList.toggle("end", tabs.scrollLeft + tabs.clientWidth >= tabs.scrollWidth - 4);
}
tabs.addEventListener("scroll", tabsEnd);
window.addEventListener("resize", tabsEnd);
function markTabs(catId){
  var want = catId == null ? "" : catId;
  Array.prototype.forEach.call(tabs.children, function(b){
    var on = (b.dataset.cat === want);
    b.classList.toggle("on", on);
    if (on && b.scrollIntoView) b.scrollIntoView({ block:"nearest", inline:"center" });
  });
  tabsEnd();
}
// 見出しを画面上部に貼りつけるため、ヘッダーの高さを CSS に伝える
function syncHeaderHeight(){
  var h = document.querySelector("header").getBoundingClientRect().height;
  document.documentElement.style.setProperty("--hh", Math.round(h) + "px");
}
window.addEventListener("resize", syncHeaderHeight);
window.addEventListener("orientationchange", function(){ setTimeout(syncHeaderHeight, 200); });

// ---- すき（お気に入り）----
// よく見る路線・駅をすぐ開けるように覚えておく。この端末のブラウザの中だけに保存し、外には送らない
var FAV_KEY = "tetsudo-zukan:fav";
function loadFav(){
  try {
    var v = JSON.parse(localStorage.getItem(FAV_KEY) || "{}");
    return { lines: v.lines || [], stations: v.stations || [] };
  } catch (e) { return { lines: [], stations: [] }; }
}
function saveFav(f){ try { localStorage.setItem(FAV_KEY, JSON.stringify(f)); } catch (e) {} }
function toggleFav(kind, id){
  var f = loadFav(), a = f[kind], i = a.indexOf(id);
  if (i >= 0) a.splice(i, 1); else a.unshift(id);      // 新しく足したものを先頭に
  saveFav(f);
  return i < 0;
}
function favButton(kind, id){
  var b = el("button", "favbtn"); b.type = "button";
  function paint(on){
    b.textContent = on ? "★ すき" : "☆ すき";
    b.classList.toggle("on", on);
    b.setAttribute("aria-pressed", on ? "true" : "false");
  }
  paint(loadFav()[kind].indexOf(id) >= 0);
  b.onclick = function(ev){ ev.stopPropagation(); paint(toggleFav(kind, id)); };
  return b;
}
function favSection(){

  });

    b.onclick = function(){ go({v:"station", id:st.id}); };
    chips.appendChild(b);
  });
  c.appendChild(chips);

// 路線いちらんの1行
function lineRow(L, sub){
  var r = el("button", "row"); r.type = "button";
  r.appendChild(badge(L, null));
  var nm = el("div", "nm");
  nm.appendChild(el("div", "kana", L.kana));
  nm.appendChild(el("div", "kanji", L.name));
  nm.appendChild(el("div", "sub", sub || (L.stations.length + "えき")));
  r.appendChild(nm);
  r.appendChild(chev());
  r.onclick = function(){ go({v:"line", id:L.id}); };
  return r;
}

// ① 路線いちらん（catId を渡すとその分類だけにしぼる）
function viewHome(catId){
  markTabs(catId);
  if (!catId){ var fs = favSection(); if (fs) view.appendChild(fs); }
  var shown = 0, shownSt = 0;
  if (catId === "express"){
    // 特急は事業者ごとにまとめる
    DATA.operators.forEach(function(o){
      var es = EXPRESSES.filter(function(e){ return e.operatorId === o.id; });
      if (!es.length) return;
      var sec = el("section", "opsec");
      sec.appendChild(el("h2", "sec", o.shortName));
      var c = el("div", "card");
      es.forEach(function(e){ c.appendChild(expRow(e)); });
      sec.appendChild(c);
      view.appendChild(sec);
    });
    var n0 = el("div", "note");
    n0.innerHTML = "特急：" + EXPRESSES.length + "れっしゃ<br>"
      + "とっきゅうけん・していせきけんが いる れっしゃです";
    view.appendChild(n0);
    return;
  }
  if (catId === "shinkansen"){
    // 新幹線はJR5社にまたがるので、会社ごとに分けず北から南の順に1つに並べる
    var sk = LINES.filter(function(L){ return L.category === "shinkansen"; });
    var ssec = el("section", "opsec");
    ssec.appendChild(el("h2", "sec", "きた から みなみ へ"));
    var sc = el("div", "card");
    sk.forEach(function(L){
      shown++; shownSt += L.stations.length;
      sc.appendChild(lineRow(L, OPS[L.operatorId].shortName + " ・ " + L.stations.length + "えき"));
    });
    ssec.appendChild(sc);
    view.appendChild(ssec);
  } else {
    DATA.operators.forEach(function(o){
      var ls = LINES.filter(function(L){
        return L.operatorId === o.id && (!catId || L.category === catId);
      });
      if (!ls.length) return;
      shown += ls.length;
      ls.forEach(function(L){ shownSt += L.stations.length; });
      // 事業者ごとに囲っておく。こうしないと貼りついた見出しが次々と積み重なってしまう
      var sec = el("section", "opsec");
      sec.appendChild(el("h2", "sec", o.shortName));
      var c = el("div", "card");
      ls.forEach(function(L){ c.appendChild(lineRow(L)); });
      sec.appendChild(c);
      view.appendChild(sec);
    });
  }
  var n = el("div", "note");
  var cat = catId && DATA.categories.filter(function(c){ return c.id === catId; })[0];
  n.innerHTML = cat
    ? cat.label + "：" + shown + "ろせん / " + shownSt + "えき"
    : DATA.lines.length + "ろせん / " + DATA.stations.length + "えき<br>"
      + "てつどうがいしゃの こうしきの ものでは ありません";
  view.appendChild(n);
}

// ---- 直通運転の小さな道具 ----
function thrLabel(x){
  return x.go === "all" ? "ちょくつう（いつも）" : x.go === "some" ? "ちょくつう（ときどき）" : "ちょくつう（はいってくる）";
}
// 直通の相手のさらに先へ、直通の電車が走っていく路線（田園都市線→半蔵門線→東武スカイツリーライン の、東武）。
// x.reach（データの「走っていく路線」）にある路線だけをたどる
function thrFar(L, x){
  var out = [], seen = {};
  seen[L.id] = true; seen[x.other] = true;
  (function walk(Y, enteredAt, go, depth){
    if (depth > 4) return;
    (THR_OF_LINE[Y] || []).forEach(function(z){
      if (z.at === enteredAt || seen[z.other] || x.reach.indexOf(z.other) < 0) return;
      seen[z.other] = true;
      var g = (go === "all" && z.go === "all") ? "all" : "some";
      // とおり道の路線も走っていく路線に入っていれば、とおる順に1段ずつ並べる
      // （東急目黒線 ⇄ 東急新横浜線 ⇄ 相鉄新横浜線 ⇄ 相鉄本線）
      var d = depth;
      z.via.forEach(function(v){
        if (seen[v] || x.reach.indexOf(v) < 0) return;
        seen[v] = true;
        out.push({ line:v, go:g, at:z.at, depth:d });
        d++;
      });
      out.push({ line:z.other, go:g, at:z.otherAt, depth:d });
      walk(z.other, z.otherAt, g, d + 1);
    });
  })(x.other, x.otherAt, x.go, 1);
  // 直通の境目どうしのつながりでは届かない、同じ会社の中の先の路線（東武スカイツリーラインの先の
  // 伊勢崎線・東武日光線、京急本線の先の京急空港線 など）。走っていく路線に入っていて、
  // すでに並べた路線と同じ駅を持つ（線路がつながる）ものを、その次の段に足す
  var placed = [{ line:x.other, depth:0 }].concat(out), added = true;
  while (added){
    added = false;
    x.reach.forEach(function(r){
      if (seen[r]) return;
      var R = lineById(r);
      if (!R) return;
      for (var i = 0; i < placed.length; i++){
        var Y = lineById(placed[i].line);
        var common = Y && R.stations.filter(function(e){
          return Y.stations.some(function(f){ return f.stationId === e.stationId; });
        })[0];
        if (!common) continue;
        seen[r] = true; added = true;
        var f = { line:r, go:"some", at:common.stationId, depth:placed[i].depth + 1 };
        out.push(f); placed.push(f);
        break;
      }
    });
  }
  return out;
}
// 路線の画面の見出しの下に出す「ちょくつうで つながる ろせん」。
// 起点の駅でつながる路線を左、それ以外を右に置き、その先の路線も続けて並べる。
// 相手が片側に2つ以上あるときは、相手ごとに1行にする（どれとどれがつながるか分かるように）
function thrChainSection(L, list, shown){
  var idxOf = function(sid){
    for (var i = 0; i < L.stations.length; i++) if (L.stations[i].stationId === sid) return i;
    return 0;
  };
  var sorted = list.slice().sort(function(p, q){ return idxOf(p.at) - idxOf(q.at); });
  var left = sorted.filter(function(x){ return idxOf(x.at) === 0; });
  var right = sorted.filter(function(x){ return idxOf(x.at) !== 0; });
  function chip(id, goKind, focusAt, far){
    var O = lineById(id);
    shown[id] = true;
    var b = el("button", "chip" + (goKind === "all" ? "" : " some") + (far ? " far" : ""), O.name); b.type = "button";
    b.style.setProperty("--c", O.color);
    b.onclick = function(){ go({v:"line", id:O.id, focus:focusAt}); };
    return b;
  }
  function arrow(){ return el("span", "thrarrow", "⇄"); }
  // 相手 x とその先を、自分から見た順の部品の並びにする（[相手, ⇄, その先, …]）
  function partsOf(x){
    var parts = [chip(x.other, x.go, x.otherAt, false)];
    var far = thrFar(L, x), d = 1;
    while (far.some(function(f){ return f.depth === d; })){
      parts.push(arrow());
      var grp = el("span", "thrfargrp");
      far.filter(function(f){ return f.depth === d; }).forEach(function(f, n){
        if (n) grp.appendChild(el("span", "thrdot", "・"));
        grp.appendChild(chip(f.line, f.go, f.at, true));
      });
      parts.push(grp);
      d++;
    }
    return parts;
  }
  function me(){ var m = el("span", "chip me", L.name); m.style.setProperty("--c", L.color); return m; }
  var sec = el("section", "opsec");
  sec.appendChild(el("h2", "sec", "ちょくつうで つながる ろせん"));
  var c = el("div", "card chipcard");
  var rows = [];
  if (left.length <= 1 && right.length <= 1){
    rows.push({ left:left[0], right:right[0] });
  } else {
    left.forEach(function(x){ rows.push({ left:x }); });
    right.forEach(function(x){ rows.push({ right:x }); });
  }
  rows.forEach(function(rw){
    var row = el("div", "chips thrchain");
    if (rw.left){ partsOf(rw.left).reverse().forEach(function(p){ row.appendChild(p); }); row.appendChild(arrow()); }
    row.appendChild(me());
    if (rw.right){ row.appendChild(arrow()); partsOf(rw.right).forEach(function(p){ row.appendChild(p); }); }
    c.appendChild(row);
  });
  c.appendChild(el("div", "chiplegend", "のりかえなしで そのまま いける ろせん。てんせんは いちぶの でんしゃだけ"));
  sec.appendChild(c);
  return sec;
}
// 直通の電車が入ってくるだけの路線（東武伊勢崎線 など）に出す案内
function thrIncomingSection(L, shown){
  var inc = (THR_INCOMING[L.id] || []).filter(function(id){ return !shown[id] && id !== L.id && lineById(id); });
  if (!inc.length) return null;
  var sec = el("section", "opsec");
  sec.appendChild(el("h2", "sec", "ちょくつうの でんしゃが くる ろせん"));
  var c = el("div", "card chipcard");
  var row = el("div", "chips");
  inc.forEach(function(id){
    var O = lineById(id);
    var b = el("button", "chip some", O.name); b.type = "button";
    b.style.setProperty("--c", O.color);
    b.onclick = function(){ go({v:"line", id:O.id}); };
    row.appendChild(b);
  });
  c.appendChild(row);
  c.appendChild(el("div", "chiplegend", "この ろせんまで、のりかえなしで はいってくる でんしゃが ある ろせん（いちぶの でんしゃ）"));
  sec.appendChild(c);
  return sec;
}
// 直通の電車が「とおり道」の短い路線でとおる駅（東武スカイツリーラインの曳舟から押上 など）。
// 境目の駅から外へ向かう順。自分の路線にもある駅は出さない
function viaStops(L, x){
  var out = [], cur = x.at;
  x.via.forEach(function(v, i){
    var V = lineById(v);
    if (!V) return;
    var ids = V.stations.map(function(e){ return e.stationId; });
    var end = i === x.via.length - 1 ? x.otherAt : meetOn(v, x.via[i + 1], x.otherAt);
    var s = ids.indexOf(cur);
    if (s < 0 && x.gapAt){ s = ids.indexOf(x.gapAt); if (s >= 0) out.push({ line:V, e:V.stations[s] }); }
    var t = ids.indexOf(end);
    if (s < 0 || t < 0) return;
    var step = t >= s ? 1 : -1;
    for (var k = s + step; k !== t + step; k += step) out.push({ line:V, e:V.stations[k] });
    cur = end;
  });
  var mine = {};
  L.stations.forEach(function(e){ mine[e.stationId] = true; });
  var seen = {};
  return out.filter(function(o){
    var sid = o.e.stationId;
    if (mine[sid] || seen[sid]) return false;
    seen[sid] = true;
    return true;
  });
}
function viaStopRow(L, o, atEnd){
  var st = STATIONS[o.e.stationId];
  var b = el("button", "stop viastop" + (atEnd ? " end" : " mid")); b.type = "button";
  b.style.setProperty("--c", atEnd ? o.line.color : L.color);
  var tr = el("div", "track");
  tr.appendChild(badge(o.line, o.e.numbering, true));
  b.appendChild(tr);
  var nmb = nameBlock(st, true);
  nmb.appendChild(el("div", "sub", "とおる えき（" + o.line.name + "）"));
  b.appendChild(nmb);
  b.onclick = function(){ go({v:"station", id:st.id}); };
  return b;
}
// 路線の画面で、境目の駅のとなりに入れる行。「このまま ○○線へ（○○ まで）」
// 線の端の駅なら線を相手の色にし、途中の駅なら自分の線はそのまま続けて印だけ出す
function thrRow(L, x, atEnd, stops){
  var O = lineById(x.other);
  var r = el("div", "stop thru" + (x.go === "all" ? "" : " some") + (atEnd ? " end" : " mid"));
  r.setAttribute("role", "button");
  r.tabIndex = 0;
  r.style.setProperty("--c", atEnd ? O.color : L.color);
  r.style.setProperty("--c2", O.color);
  var tr = el("div", "track"); tr.appendChild(el("div", "thrmark", "⇄"));
  r.appendChild(tr);
  var nm = el("div", "nm");
  nm.appendChild(el("div", "kana", thrLabel(x)));
  nm.appendChild(el("div", "kanji", x.go === "none"
    ? O.name + " から でんしゃが はいってくる"
    : "このまま " + O.name + " へ"));
  // よく行く先は、相手の路線の駅（○○ まで）と、その先の別の路線の駅（そのさき ○○線の ○○ まで）に分けて出す
  var near = [], far = [], farLines = [];
  x.to.forEach(function(t){
    var s = STATIONS[t.station];
    if (!s) return;
    if (t.line === O.id){ near.push(s.name); return; }
    var i = farLines.indexOf(t.line);
    if (i < 0){ farLines.push(t.line); far.push([s.name]); } else far[i].push(s.name);
  });
  if (near.length) nm.appendChild(el("div", "sub", near.join("・") + " まで"));
  if (far.length){
    nm.appendChild(el("div", "sub farto", "そのさき " + farLines.map(function(id, i){
      var FL = lineById(id);
      return (FL ? FL.name + "の " : "") + far[i].join("・");
    }).join("、") + " まで"));
  }
  if (stops && stops.length){
    var vc = el("div", "viachips");
    vc.appendChild(el("span", "lbl", "とおる えき"));
    stops.forEach(function(o){
      var st = STATIONS[o.e.stationId];
      var b = el("button", "viachip", (o.e.numbering ? o.e.numbering + " " : "") + st.name); b.type = "button";
      b.style.setProperty("--c2", o.line.color);
      b.onclick = function(ev){ ev.stopPropagation(); go({v:"station", id:st.id}); };
      vc.appendChild(b);
    });
    nm.appendChild(vc);
  }
  r.appendChild(nm);
  r.appendChild(chev());
  r.onclick = function(){ go({v:"line", id:O.id, focus:x.otherAt}); };
  r.onkeydown = function(ev){ if (ev.key === "Enter" || ev.key === " "){ ev.preventDefault(); r.onclick(); } };
  return r;
}
// 境目の駅のとなりに入れる行のまとまり（とおる駅 ＋「このまま ○○線へ」）。
// 起点の駅なら駅の上に、相手側から順に（相手 → とおる駅 → この駅）並べる
// 1つの駅に直通先が2つ以上あるとき（相鉄本線の西谷など）は、縦に並べると別々の行き先が
// 1本の線に見えてしまうので、とおる駅は「このまま ○○線へ」の行の中にボタンで出す（compact）
function thrBlock(L, x, atEnd, above, compact){
  var stops = viaStops(L, x);
  if (compact) return [thrRow(L, x, atEnd, stops)];
  var rows = stops.map(function(o){ return viaStopRow(L, o, atEnd); });
  rows.push(thrRow(L, x, atEnd));
  return above ? rows.reverse() : rows;
}

// ② 路線 → 駅（起点から順）。focus に駅idを渡すとその駅を目立たせる
function viewLine(id, focus){
  var L = lineById(id);
  if (!L) return;
  var h = el("div", "lhead"); h.style.setProperty("--c", L.color);
  h.appendChild(badge(L, null));
  var t = el("div", "t");
  t.appendChild(el("div", "kana", L.kana));
  t.appendChild(el("div", "nm2", L.name));
  var meta = el("div", "meta");
  meta.innerHTML = '<span class="swatch"></span>' + L.colorName + " ・ "
    + OPS[L.operatorId].shortName + " ・ " + L.stations.length + "えき"
    + (L.loop ? ' ・ <b class="loopmark">↻ ぐるっと 1しゅう</b>' : "");
  t.appendChild(meta);
  h.appendChild(t);
  h.appendChild(favButton("lines", L.id));
  view.appendChild(h);

  var thr = THR_OF_LINE[L.id] || [];
  var shown = {};
  if (thr.length) view.appendChild(thrChainSection(L, thr, shown));
  var incSec = thrIncomingSection(L, shown);
  if (incSec) view.appendChild(incSec);

  var rail = el("div", "rail");
  var lastIdx = L.stations.length - 1;
  L.stations.forEach(function(e, i){
    var st = STATIONS[e.stationId];
    var here = thr.filter(function(x){ return x.at === st.id; });
    // 起点の駅でつながる直通は、駅の上に出す（線が相手の路線から続いてくるように見せる）
    var compact = here.length > 1;
    if (i === 0 && !L.loop) here.forEach(function(x){ thrBlock(L, x, true, true, compact).forEach(function(r){ rail.appendChild(r); }); });
    var b = el("button", "stop" + (focus && st.id === focus ? " focus" : "")); b.type = "button";
    b.style.setProperty("--c", L.color);
    var tr = el("div", "track");
    tr.appendChild(badge(L, e.numbering, true));
    b.appendChild(tr);
    var nmb = nameBlock(st);
    if (here.length){
      var tag = el("div", "thrtag", "⇄ ちょくつう");
      tag.style.setProperty("--c2", lineById(here[0].other).color);
      nmb.appendChild(tag);
    }
    b.appendChild(nmb);
    // 乗りかえできる路線
    var others = (BY_STATION[st.id] || []).filter(function(x){ return x.line.id !== L.id; });
    // 歩いて乗り換えられる駅の路線（この駅にすでにある路線は重ねない）
    var have = {}; have[L.id] = true;
    others.forEach(function(o){ have[o.line.id] = true; });
    var walkLines = [];
    (WALKS[st.id] || []).forEach(function(w){
      (BY_STATION[w.to] || []).forEach(function(o){
        if (!have[o.line.id]){ have[o.line.id] = true; walkLines.push(o.line); }
      });
    });
    if (others.length || walkLines.length){
      var x = el("div", "xfer");
      others.forEach(function(o){ x.appendChild(mini(o.line)); });
      walkLines.forEach(function(wl){ x.appendChild(mini(wl, true)); });
      b.appendChild(x);
    }
    b.onclick = function(){ go({v:"station", id:st.id}); };
    rail.appendChild(b);
    if (i !== 0 || L.loop) here.forEach(function(x){
      thrBlock(L, x, i === lastIdx && !L.loop, false, compact).forEach(function(r){ rail.appendChild(r); });
    });
  });
  // 環状線は、最後の駅のあと最初の駅にもどることを線でつないで見せる
  if (L.loop){
    var first = STATIONS[L.stations[0].stationId];
    var lp = el("button", "stop loopend"); lp.type = "button";
    lp.style.setProperty("--c", L.color);
    var tr0 = el("div", "track"); tr0.appendChild(el("div", "loopicon", "↻"));
    lp.appendChild(tr0);
    lp.appendChild(el("div", "looptxt", "ぐるっと まわって " + first.name + " に もどる"));
    lp.onclick = function(){
      var top = rail.querySelector(".stop");
      top.classList.remove("focus"); void top.offsetWidth; top.classList.add("focus");
      var head = document.querySelector("header").getBoundingClientRect().height;
      window.scrollTo({ top: window.scrollY + top.getBoundingClientRect().top - head - 12, behavior: "smooth" });
    };
    rail.appendChild(lp);
  }
  view.appendChild(rail);

  var tl = TRAINS_OF_LINE[L.id] || [];
  if (tl.length){
    var ts = el("section", "opsec");
    ts.appendChild(el("h2", "sec", "はしる れっしゃ"));
    var tc = el("div", "card");
    tl.forEach(function(t){
      var r = el("button", "row"); r.type = "button";
      var nm = el("div", "nm");
      nm.appendChild(el("div", "kana", t.kana));
      nm.appendChild(el("div", "kanji", t.name));
      var cnt = t.stops.filter(function(x){ return x.stop === "all"; }).length;
      nm.appendChild(el("div", "sub", t.stops.length + "えきに とまる（いつも とまる " + cnt + "えき）"));
      r.appendChild(nm);
      r.appendChild(chev());
      r.onclick = function(){ go({v:"train", id:t.id}); };
      tc.appendChild(r);
    });
    ts.appendChild(tc);
    view.appendChild(ts);
  }

  var el2 = (EXP_OF_LINE[L.id] || []).map(function(e){ return { exp:e }; });
  if (el2.length) view.appendChild(expChips(el2, "はしる とっきゅう"));

  if (!L.verified){
    view.appendChild(el("div", "warn",
      "⚠ この路線はまだ人の確認が済んでいません。駅の順番を路線図で確かめてください。"));
  }
  // 正式な名前が案内の名前とちがうときだけ出す（西武新宿線＝新宿線 など）
  if (L.formalName && L.formalName !== L.name){
    view.appendChild(el("div", "note", "せいしきな なまえ：" + L.formalName));
  }
}

// ③ 駅 → つながる全路線
function viewStation(id){
  var st = STATIONS[id];
  if (!st) return;
  var entries = BY_STATION[id] || [];
  var walks = (WALKS[id] || []).filter(function(w){ return STATIONS[w.to]; });
  var h = el("div", "shead");
  h.appendChild(el("div", "kana", st.kana));
  h.appendChild(el("div", "kanji", st.name));
  if (st.subName) h.appendChild(el("div", "sub", "〈" + st.subName + "〉 " + st.subKana));
  h.appendChild(el("div", "cnt", entries.length + "ろせんが とまります" +
    (walks.length ? " ／ あるいて のりかえ " + walks.length + "えき" : "")));
  h.appendChild(favButton("stations", id));
  view.appendChild(h);

  function lineCard(e){
    var L = e.line;
    var c = el("div", "lncard"); c.style.setProperty("--c", L.color);
    var hd = el("div", "hd2");
    hd.appendChild(badge(L, e.numbering, true));
    var t = el("div", "t"); t.textContent = L.name;
    t.appendChild(el("small", null, OPS[L.operatorId].shortName + " ・ " + L.colorName));
    hd.appendChild(t);
    var go2 = el("button", "go", "ろせんを見る"); go2.type = "button";
    go2.onclick = function(){ go({v:"line", id:L.id, focus:st.id}); };
    hd.appendChild(go2);
    c.appendChild(hd);

    var nb = el("div", "nbrs");
    [[-1, "まえの えき"], [1, "つぎの えき"]].forEach(function(p){
      var next = neighbor(L, e.idx, p[0]);
      var thrHere = !next && (THR_OF_LINE[L.id] || []).filter(function(x){ return x.at === st.id && x.go !== "none"; })[0];
      if (thrHere){
        var O = lineById(thrHere.other);
        var bt0 = el("button", "nbr thrnbr"); bt0.type = "button";
        bt0.style.setProperty("--c2", O.color);
        bt0.appendChild(el("div", "lbl", p[1]));
        bt0.appendChild(el("div", "v", "⇄ " + O.name + "へ ちょくつう"));
        bt0.onclick = function(){ go({v:"line", id:O.id, focus:thrHere.otherAt}); };
        nb.appendChild(bt0);
        return;
      }
      if (!next){
        var d = el("div", "nbr end");
        d.appendChild(el("div", "lbl", p[1]));
        d.appendChild(el("div", "v", "— しゅうてん —"));
        nb.appendChild(d);
        return;
      }
      var ns = STATIONS[next.stationId];
      var bt = el("button", "nbr"); bt.type = "button";
      bt.appendChild(el("div", "lbl", p[1]));
      bt.appendChild(el("div", "v", stopLabel(next, ns)));
      bt.onclick = function(){ go({v:"station", id:ns.id}); };
      nb.appendChild(bt);
    });
    c.appendChild(nb);
    return c;
  }

  // 直通でつながる路線のカードは、となりに並べて枠でかこむ（ふつうの乗りかえと見分けるため）。
  // この駅に両方の路線があるつながりだけを見る
  var here = {};
  entries.forEach(function(e, i){ here[e.line.id] = i; });
  var pairs = [];
  entries.forEach(function(e, i){
    (THR_OF_LINE[e.line.id] || []).forEach(function(x){
      var j = here[x.next] !== undefined ? here[x.next] : here[x.other];
      if (x.at !== id || j === undefined || j === i) return;
      var p = null;
      for (var k = 0; k < pairs.length; k++) if (pairs[k].a === Math.min(i, j) && pairs[k].b === Math.max(i, j)) p = pairs[k];
      if (!p){ p = { a:Math.min(i, j), b:Math.max(i, j), go:{} }; pairs.push(p); }
      p.go[i] = x.go;
    });
  });
  var grp = entries.map(function(e, i){ return i; });
  function root(i){ while (grp[i] !== i) i = grp[i]; return i; }
  pairs.forEach(function(p){ grp[root(p.b)] = root(p.a); });
  function pairOf(i, j){
    for (var k = 0; k < pairs.length; k++) if ((pairs[k].a === i && pairs[k].b === j) || (pairs[k].a === j && pairs[k].b === i)) return pairs[k];
    return null;
  }
  function pairText(p){
    var anyAll = p.go[p.a] === "all" || p.go[p.b] === "all";
    var oneWay = p.go[p.a] === "none" || p.go[p.b] === "none";
    if (oneWay){
      var from = entries[p.go[p.a] === "none" ? p.b : p.a].line.name;
      return "⇅ ちょくつう：" + from + "の でんしゃが そのまま はいってくる";
    }
    return "⇅ ちょくつう：" + (anyAll ? "" : "いちぶの でんしゃは ") + "のりかえなしで そのまま いける";
  }
  var done = {};
  entries.forEach(function(e, i){
    var r = root(i);
    if (done[r]) return;
    done[r] = true;
    var members = entries.map(function(x, j){ return j; }).filter(function(j){ return root(j) === r; });
    if (members.length === 1){ view.appendChild(lineCard(e)); return; }
    // いちばん多くの路線とつながる路線（和光市なら東上線）を2番目に置き、両どなりとつなげて見せる
    if (members.length > 2){
      var deg = function(j){ return members.filter(function(m){ return m !== j && pairOf(m, j); }).length; };
      var hub = members.slice().sort(function(p, q){ return deg(q) - deg(p); })[0];
      var rest = members.filter(function(m){ return m !== hub; });
      members = [rest[0], hub].concat(rest.slice(1));
    }
    var shown = 0;
    var box = el("div", "thrgroup");
    members.forEach(function(j, n){
      if (n > 0){
        var p = pairOf(members[n - 1], j);
        if (p){
          var cn = el("div", "thrconn" + (p.go[p.a] === "all" || p.go[p.b] === "all" ? "" : " some"), pairText(p));
          box.appendChild(cn);
          shown++;
        } else {
          box.appendChild(el("div", "thrgap"));
        }
      }
      box.appendChild(lineCard(entries[j]));
    });
    // となり同士で見せきれないつながりがあるときは、下にまとめて書く
    var inGroup = pairs.filter(function(p){ return root(p.a) === r; });
    if (inGroup.length > shown){
      var ft = el("div", "thrfoot");
      inGroup.forEach(function(p){
        ft.appendChild(el("div", null, entries[p.a].line.name + " ⇄ " + entries[p.b].line.name + "：" + pairText(p).replace("⇅ ちょくつう：", "")));
      });
      box.appendChild(ft);
    }
    view.appendChild(box);
  });

  // 新幹線の列車のうち、この駅にとまるもの
  var tst = TRAINS_OF_STATION[id] || [];
  if (tst.length){
    var sec2 = el("section", "opsec");
    sec2.appendChild(el("h2", "sec", "とまる しんかんせん"));
    // 1本1行だと東京駅で14行になるので、ボタンを横に並べて短くする
    var c2 = el("div", "card chipcard");
    var chips = el("div", "chips");
    tst.forEach(function(x){
      var L0 = lineById(x.train.lines[0]);
      var b = el("button", "chip" + (x.stop === "some" ? " some" : ""), x.train.name); b.type = "button";
      b.style.setProperty("--c", L0 ? L0.color : "#888");
      b.onclick = function(){ go({v:"train", id:x.train.id}); };
      chips.appendChild(b);
    });
    c2.appendChild(chips);
    if (tst.some(function(x){ return x.stop === "some"; })){
      c2.appendChild(el("div", "chiplegend", "てんせんの れっしゃは ときどき とまります"));
    }
    sec2.appendChild(c2);
    view.appendChild(sec2);
  }

  var est = EXP_OF_STATION[id] || [];
  if (est.length) view.appendChild(expChips(est, "とまる とっきゅう"));

  // 駅名は違うが、歩いて乗り換えられる駅
  if (walks.length){
    var ws = el("section", "opsec walksec");
    ws.appendChild(el("h2", "sec", "🚶 あるいて のりかえ"));
    var wc = el("div", "card");
    walks.forEach(function(w){
      var to = STATIONS[w.to];
      var r = el("button", "row"); r.type = "button";
      var nmb = nameBlock(to, true);
      nmb.appendChild(el("div", "wkind", WALK_LABEL[w.kind] || ""));
      r.appendChild(nmb);
      var xx = el("div", "xfer"); xx.style.marginLeft = "auto";
      (BY_STATION[w.to] || []).forEach(function(o){ xx.appendChild(mini(o.line)); });
      r.appendChild(xx);
      r.appendChild(chev());
      r.onclick = function(){ go({v:"station", id:to.id}); };
      wc.appendChild(r);
    });
    ws.appendChild(wc);
    view.appendChild(ws);
  }
}

// 検索
function viewSearch(q){
  var k = norm(q);
  // 「い」と入れたら「い」で始まるものだけ出す（前方一致）。
  // 「いし」なら「いし」で始まるもの。五十音をたどる使いかたに合わせている
  function head(v){ var t = norm(v); return t && t.indexOf(k) === 0; }

  var ls = LINES.filter(function(L){
    return head(L.name) || head(L.kana) || norm(L.symbol) === k || head(L.formalName);
  });
  var sts = DATA.stations.filter(function(s){
    // 副称（明治神宮前〈原宿〉の「原宿」）は、それだけでも先頭から引けるようにする
    if (head(s.name) || head(s.kana) || head(s.subName) || head(s.subKana)) return true;
    return (BY_STATION[s.id] || []).some(function(e){ return head(e.numbering); });
  });

  // 新幹線の列車名（のぞみ・はやぶさ など）でも引けるようにする
  var trs = TRAINS.filter(function(t){ return head(t.name) || head(t.kana); });

  // 特急の名前・車両の愛称・別名（らびゅー など）でも引けるようにする
  var exs = EXPRESSES.filter(function(e){
    return head(e.name) || head(e.kana) || head(e.car) || (e.aliases || []).some(head)
      || e.variants.some(function(v){ return head(v.name); });
  });

  if (!ls.length && !sts.length && !trs.length && !exs.length){
    view.appendChild(el("div", "empty", "「" + q + "」は みつかりませんでした"));
    return;
  }
  if (trs.length){
    var s0 = el("section", "opsec");
    s0.appendChild(el("h2", "sec", "しんかんせん " + trs.length + "けん"));
    var c0 = el("div", "card");
    trs.forEach(function(t){
      var r = el("button", "row"); r.type = "button";
      var nm = el("div", "nm sm");
      nm.appendChild(el("div", "kana", t.kana));
      nm.appendChild(el("div", "kanji", t.name));
      nm.appendChild(el("div", "sub", t.stops.length + "えきに とまる"));
      r.appendChild(nm); r.appendChild(chev());
      r.onclick = function(){ go({v:"train", id:t.id}); };
      c0.appendChild(r);
    });
    s0.appendChild(c0);
    view.appendChild(s0);
  }
  if (exs.length){
    var sx = el("section", "opsec");
    sx.appendChild(el("h2", "sec", "とっきゅう " + exs.length + "けん"));
    var cx = el("div", "card");
    exs.forEach(function(e){ cx.appendChild(expRow(e)); });
    sx.appendChild(cx);
    view.appendChild(sx);
  }
  if (ls.length){
    var s1 = el("section", "opsec");
    s1.appendChild(el("h2", "sec", "ろせん " + ls.length + "けん"));
    var c1 = el("div", "card");
    ls.forEach(function(L){
      var r = el("button", "row"); r.type = "button";
      r.appendChild(badge(L, null, true));
      var nm = el("div", "nm sm");
      nm.appendChild(el("div", "kana", L.kana));
      nm.appendChild(el("div", "kanji", L.name));
      r.appendChild(nm); r.appendChild(chev());
      r.onclick = function(){ go({v:"line", id:L.id}); };
      c1.appendChild(r);
    });
    s1.appendChild(c1);
    view.appendChild(s1);
  }
  if (sts.length){
    var s2 = el("section", "opsec");
    s2.appendChild(el("h2", "sec", "えき " + sts.length + "けん"));
    var c2 = el("div", "card");
    sts.forEach(function(s){
      var r = el("button", "row"); r.type = "button";
      var wrapb = el("div", "xfer"); wrapb.style.maxWidth = "none";
      (BY_STATION[s.id] || []).forEach(function(e){ wrapb.appendChild(mini(e.line)); });
      r.appendChild(nameBlock(s, true));
      wrapb.style.marginLeft = "auto";
      r.appendChild(wrapb);
      r.appendChild(chev());
      r.onclick = function(){ go({v:"station", id:s.id}); };
      c2.appendChild(r);
    });
    s2.appendChild(c2);
    view.appendChild(s2);
  }
}

var timer = null;
function homeOp(){                     // 選んでいた事業者タブを覚えておく
  for (var i = stack.length - 1; i >= 0; i--) if (stack[i].v === "home") return stack[i].op;
  return null;
}
qbox.addEventListener("input", function(){
  clr.classList.toggle("on", !!qbox.value);
  clearTimeout(timer);
  timer = setTimeout(function(){
    var q = qbox.value.trim(), op = homeOp();
    // 文字を打つたびに履歴が増えないよう、検索に入る最初の1回だけ履歴を積む
    var already = stack.length > 1 && stack[stack.length - 1].v === "search";
    if (!q){ stack = [{ v:"home", op:op }]; resetHistory(); go(stack[0], false); return; }
    stack = [{ v:"home", op:op }, { v:"search", q:q }];
    render(stack[1]); updateNav(stack[1]); window.scrollTo(0, 0);
    if (!already) pushHistory();
  }, 120);
});
clr.onclick = function(){
  var op = homeOp();
  qbox.value = ""; clr.classList.remove("on");
  stack = [{ v:"home", op:op }]; resetHistory(); go(stack[0], false);
  qbox.focus();
};

// ---- 診断画面（?pwa を付けて開いたときだけ出る）----
// スマホでホーム画面に追加できないときに、何が足りないのかを見るためのもの
if (/[?&]pwa/.test(location.search)){
  window.addEventListener("load", function(){ setTimeout(showPwaStatus, 1200); });
}
function showPwaStatus(){
  var rows = [];
  var add = function(k, v, good){
    rows.push('<tr><td style="padding:6px 10px;border-bottom:1px solid #dfe3ec;white-space:nowrap">' + k +
      '</td><td style="padding:6px 10px;border-bottom:1px solid #dfe3ec;word-break:break-all;' +
      (good === true ? "color:#137333" : good === false ? "color:#c5221f;font-weight:700" : "") +
      '">' + v + "</td></tr>");
  };
  var standalone = window.matchMedia("(display-mode: standalone)").matches ||
                   navigator.standalone === true;
  add("URL", location.href);
  add("安全な接続(HTTPS)", window.isSecureContext ? "はい" : "いいえ", window.isSecureContext);
  add("ServiceWorker対応", ("serviceWorker" in navigator) ? "対応" : "非対応",
      "serviceWorker" in navigator);
  add("いま独立起動中", standalone ? "はい（インストール済み）" : "いいえ（ブラウザ内）");

  var done = function(){
    var box = el("div", "card");
    box.innerHTML = '<div style="padding:14px 12px 6px;font-weight:800;font-size:16px">' +
      "PWAの状態しらべ</div><table style='width:100%;border-collapse:collapse;font-size:13px'>" +
      rows.join("") + "</table>" +
      '<div style="padding:10px 12px;font-size:12px;color:#6b7280">' +
      "この画面はURLの末尾から <code>?pwa</code> を消すと出なくなります。</div>";
    view.innerHTML = "";
    view.appendChild(box);
    tabs.classList.remove("on");
  };

  fetch("./manifest.webmanifest").then(function(r){
    add("manifest取得", r.status + " " + (r.headers.get("content-type") || ""), r.ok);
    return r.json();
  }).then(function(m){
    add("manifest内容", "name=" + m.name + " / display=" + m.display +
        " / icons=" + m.icons.length + "件", true);
  }).catch(function(e){
    add("manifest取得", "失敗 " + e.message, false);
  }).then(function(){
    if (!("serviceWorker" in navigator)) return null;
    return navigator.serviceWorker.getRegistrations();
  }).then(function(regs){
    if (regs == null) return;
    if (!regs.length){
      add("SW登録", swError ? ("失敗 — " + swError) : "登録なし（理由不明）", false);
    } else {
      var r = regs[0];
      add("SW登録", "成功", true);
      add("SW状態", r.active ? "active（動作中）" : r.installing ? "installing（準備中）" : "waiting",
          !!r.active);
      add("SWの担当範囲", r.scope);
    }
    add("ページの管理", navigator.serviceWorker.controller ? "SWが管理中" :
        "まだ管理していない（再読み込みで変わります）", !!navigator.serviceWorker.controller);
    return caches.keys();
  }).then(function(keys){
    if (keys) add("保存済みの箱", keys.length ? keys.join(", ") : "まだ無い", keys.length > 0);
  }).catch(function(e){
    add("しらべ中のエラー", e.message, false);
  }).then(done, done);
}
})();
</script>
